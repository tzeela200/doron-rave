<style>
  :root {
    --bg-base: #0a0c10;
    --bg-navy: #0d1420;
    --bg-card: #121a26;
    --bg-card-2: #161f2d;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text-primary: #f3efe4;
    --text-secondary: #9aa7b5;
    --text-muted: #6b7684;
    --accent-green: #7fa889;
    --accent-green-soft: rgba(127, 168, 137, 0.16);
    --accent-gold: #c9a86a;
    --accent-gold-soft: rgba(201, 168, 106, 0.14);
    --danger: #c97a6a;
    --danger-soft: rgba(201, 122, 106, 0.14);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.35);
    --nav-height: 68px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Heebo', 'Assistant', system-ui, -apple-system, sans-serif;
    direction: rtl;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(20, 35, 55, 0.55), transparent 60%),
      linear-gradient(180deg, var(--bg-base) 0%, #08090c 100%);
    min-height: 100vh;
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: calc(var(--nav-height) + 24px);
  }

  /* ===== Header / Brand ===== */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 8px;
  }

  .brand-mark {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }
  .brand-mark .brand-main {
    font-family: 'Brush Script MT', cursive;
    font-size: 26px;
    color: var(--accent-gold);
    letter-spacing: 0.5px;
  }
  .brand-mark .brand-sub {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .brand-mark img { max-height: 44px; display: block; }

  .header-icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    cursor: pointer;
  }

  .screen-title {
    font-size: 22px;
    font-weight: 700;
    padding: 4px 18px 14px;
    color: var(--text-primary);
  }

  /* ===== Layout helpers ===== */
  .screen { padding: 0 16px; animation: fadeIn 0.18s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .section-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 20px 4px 10px;
    font-weight: 600;
  }

  /* ===== Cards ===== */
  .card {
    background: linear-gradient(160deg, var(--bg-card), var(--bg-card-2));
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-card);
  }

  .card.pressable { cursor: pointer; transition: transform 0.12s ease, border-color 0.12s ease; }
  .card.pressable:active { transform: scale(0.98); border-color: var(--border-strong); }

  .event-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .event-card-name { font-size: 17px; font-weight: 700; color: var(--text-primary); }
  .event-card-meta { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  .stat-row { display: flex; gap: 10px; margin-top: 14px; }
  .stat-box {
    flex: 1;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    text-align: center;
  }
  .stat-box .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-box .stat-value { font-size: 15px; font-weight: 700; }
  .stat-value.positive { color: var(--accent-green); }
  .stat-value.negative { color: var(--danger); }

  .stat-cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 6px;
  }
  .stat-cards-grid .card { margin-bottom: 0; padding: 14px; }
  .stat-cards-grid .stat-value { font-size: 20px; }

  /* ===== Empty state ===== */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-secondary);
  }
  .empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.6; }
  .empty-state .empty-text { font-size: 15px; margin-bottom: 18px; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: var(--radius-md);
    font-size: 15px; font-weight: 600;
    padding: 13px 18px;
    cursor: pointer;
    min-height: 46px;
    transition: opacity 0.15s ease, transform 0.1s ease;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent-green), #6a9576); color: #0a0c10; width: 100%; }
  .btn-gold { background: linear-gradient(135deg, var(--accent-gold), #b18f52); color: #0a0c10; width: 100%; }
  .btn-secondary { background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text-primary); width: 100%; }
  .btn-ghost { background: transparent; color: var(--accent-gold); padding: 8px 4px; min-height: auto; }
  .btn-danger-ghost { background: var(--danger-soft); color: var(--danger); width: 100%; }
  .btn-block-row { display: flex; gap: 10px; }
  .btn-block-row .btn { flex: 1; }

  .fab {
    position: fixed;
    bottom: calc(var(--nav-height) + 14px);
    left: 50%;
    transform: translateX(-50%);
    width: 58px; height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-gold), #a9824a);
    color: #0a0c10;
    font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(201, 168, 106, 0.35);
    border: none;
    cursor: pointer;
    z-index: 30;
    max-width: 560px;
  }

  /* ===== Bottom Navigation ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 560px;
    height: var(--nav-height);
    background: rgba(13, 20, 32, 0.92);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 20;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-muted);
    font-size: 11px;
    background: none; border: none; cursor: pointer;
    font-family: inherit;
    padding: 6px 10px;
    min-width: 44px;
  }
  .nav-item.active { color: var(--accent-gold); }
  .nav-item .nav-icon { font-size: 19px; }
  .nav-spacer { width: 58px; }

  .nav-item-fab {
    position: relative; top: -16px;
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-gold), #a9824a);
    color: #0a0c10; font-size: 26px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(201, 168, 106, 0.4);
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; padding: 0;
  }
  .nav-item-fab:active { transform: scale(0.95); }

  /* ===== Forms ===== */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
  .form-label .required { color: var(--danger); margin-left: 3px; }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 15px;
    padding: 13px 14px;
    font-family: inherit;
    min-height: 46px;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none; border-color: var(--accent-gold);
  }
  .form-textarea { min-height: 90px; resize: vertical; }
  .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
  .form-error { font-size: 12px; color: var(--danger); margin-top: 5px; }

  .segmented {
    display: flex;
    background: var(--bg-card);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
    padding: 4px;
    gap: 4px;
  }
  .segmented button {
    flex: 1; padding: 10px; border: none; background: transparent;
    color: var(--text-secondary); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .segmented button.active { background: var(--accent-green-soft); color: var(--accent-green); }

  .autocomplete-wrap { position: relative; }
  .autocomplete-list {
    position: absolute; top: calc(100% + 4px); right: 0; left: 0;
    background: var(--bg-card-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    max-height: 220px; overflow-y: auto;
    z-index: 40;
    box-shadow: var(--shadow-card);
  }
  .autocomplete-item {
    padding: 12px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border-subtle);
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:active { background: rgba(255,255,255,0.04); }
  .autocomplete-item.add-new { color: var(--accent-gold); font-weight: 600; }

  /* ===== Chips / badges ===== */
  .status-chip {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .status-planned { background: rgba(154,167,181,0.14); color: var(--text-secondary); }
  .status-agreed { background: var(--accent-gold-soft); color: var(--accent-gold); }
  .status-paid { background: var(--accent-green-soft); color: var(--accent-green); }
  .status-overdue { background: var(--danger-soft); color: var(--danger); }

  /* ===== Expense list item ===== */
  .expense-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--border-subtle);
  }
  .expense-item:last-child { border-bottom: none; }
  .expense-main .expense-name { font-size: 15px; font-weight: 600; }
  .expense-main .expense-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .expense-amounts { text-align: left; }
  .expense-amounts .expense-total { font-size: 15px; font-weight: 700; }
  .expense-amounts .expense-remaining { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ===== Bottom sheet / modal ===== */
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 50; display: flex; align-items: flex-end;
    justify-content: center;
  }
  .sheet-panel {
    background: var(--bg-navy);
    border-top: 1px solid var(--border-strong);
    border-radius: 22px 22px 0 0;
    width: 100%; max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 10px 18px calc(20px + env(safe-area-inset-bottom));
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  .sheet-handle {
    width: 40px; height: 4px; background: var(--border-strong); border-radius: 2px;
    margin: 8px auto 14px;
  }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sheet-title { font-size: 18px; font-weight: 700; }
  .sheet-close { color: var(--text-secondary); font-size: 22px; background: none; border: none; cursor: pointer; }

  .accordion-toggle {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; color: var(--accent-gold); font-size: 14px; font-weight: 600;
    cursor: pointer; border-top: 1px solid var(--border-subtle); margin-top: 4px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: calc(var(--nav-height) + 20px); left: 50%; transform: translateX(-50%);
    background: var(--bg-card-2); border: 1px solid var(--border-strong);
    color: var(--text-primary); padding: 12px 20px; border-radius: 999px;
    font-size: 13px; z-index: 100; box-shadow: var(--shadow-card);
    max-width: 90%; text-align: center;
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* ===== Loading ===== */
  .loading-wrap { display: flex; flex-direction: column; align-items: center; padding: 60px 0; color: var(--text-secondary); font-size: 13px; gap: 12px; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--border-subtle); border-top-color: var(--accent-gold);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton {
    background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-2) 37%, var(--bg-card) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: var(--radius-md);
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .settings-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 4px; border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row-label { font-size: 15px; }
  .settings-row-arrow { color: var(--text-muted); }

  a { color: var(--accent-gold); }
</style>
