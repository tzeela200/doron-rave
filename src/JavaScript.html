/** שעות הופעה — רק בקטגוריית "אמנים" (סעיף 12) */
function renderPerformanceFieldHtml(existing) {
  var s = expenseSheetState;
  if (!s.categoryId || !isCategoryArtists(s.categoryId)) return '';
  var start = (existing && existing.performance_start_time) || '';
  var end = (existing && existing.performance_end_time) || '';
  return '<div class="perf-box">' +
    '<div class="perf-title">שעות הופעה</div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label class="form-label" for="perf-start">משעה</label>' +
        '<input class="form-input" id="perf-start" type="time" value="' + escapeHtml(start) + '" oninput="updatePerformanceInfo()"></div>' +
      '<div class="form-group"><label class="form-label" for="perf-end">עד שעה</label>' +
        '<input class="form-input" id="perf-end" type="time" value="' + escapeHtml(end) + '" oninput="updatePerformanceInfo()"></div>' +
    '</div>' +
    '<div class="perf-info" id="perf-info"></div>' +
  '</div>';
}

/** משך ועלות לשעה מתעדכנים מיד עם שינוי שעה או סכום */
function updatePerformanceInfo() {
  var out = document.getElementById('perf-info');
  if (!out) return;
  var startEl = document.getElementById('perf-start'), endEl = document.getElementById('perf-end');
  var start = startEl ? startEl.value : '', end = endEl ? endEl.value : '';
  if (!start && !end) { out.innerHTML = '<span class="form-hint">לא חובה למלא שעות.</span>'; return; }
  if (!start || !end) { out.innerHTML = '<span class="perf-missing">צריך למלא גם שעת התחלה וגם שעת סיום.</span>'; return; }
  var minutes = durationMinutes(start, end);
  var amount = Number((document.getElementById('expense-amount') || {}).value) || 0;
  var rate = (minutes && amount > 0) ? Math.round(amount / (minutes / 60)) : null;
  out.innerHTML = '<span class="perf-duration">' + durationText(minutes) + '</span>' +
    (rate ? '<span class="perf-rate">' + formatCurrency(rate) + ' לשעת נגינה</span>' : '');
}

function renderWhomFieldHtml() {
  var isArtist = isCategoryArtists(expenseSheetState.categoryId);
  expenseSheetState.whomIsArtist = isArtist;
  var label = isArtist ? 'אמן' : 'למי משלמים?';
  var value = isArtist ? artistNameById(expenseSheetState.artistId) : vendorNameById(expenseSheetState.vendorId);
  return '' +
    '<label class="form-label" for="whom-search">' + label + '</label>' +
    '<div class="autocomplete-wrap">' +
      '<input class="form-input" id="whom-search" placeholder="בחר או הקלד שם" autocomplete="off" value="' + escapeHtml(value) + '" ' +
        'oninput="clearWhomSelection(); onWhomSearch(this.value)" onfocus="onWhomSearch(this.value)">' +
      '<div id="whom-list" class="autocomplete-list" style="display:none;"></div>' +
    '</div>';
}

/* ---- Status + quick payment (main form) ---- */
/**
 * אזור הסכומים. השדה הראשי הוא זה שתואם לסטטוס:
 * "מתוכנן" → סכום מתוכנן, "סוכם" → סכום מוסכם.
 * זו הסיבה שעד עכשיו "מתוכנן" ו"מוסכם" הציגו את אותו מספר — הכול נכנס למוסכם.
 */
function renderAmountFieldHtml(existing) {
  var s = expenseSheetState;
  var isPlanned = s.statusChoice === STATUS.PLANNED;
  var agreedVal = existing ? (existing.agreed_amount || '') : '';
  var plannedVal = existing && existing.planned_amount ? existing.planned_amount : '';

  var money = function (id, name, label, value, required, oninput) {
    return '<div class="form-group">' +
      '<label class="form-label" for="' + id + '">' + label +
        (required ? '<span class="required">*</span>' : ' <span class="optional">(לא חובה)</span>') + '</label>' +
      '<div class="money-input"><input class="form-input" id="' + id + '" name="' + name + '" type="number" ' +
        'inputmode="numeric" min="0" step="1"' + (required ? ' required' : '') +
        ' value="' + value + '" placeholder="0" oninput="' + oninput + '"></div></div>';
  };

  var agreed = money('expense-amount', 'agreed_amount', 'סכום מוסכם', agreedVal, !isPlanned,
    'updatePlannedDiff(); refreshPaymentSummary(); updatePerformanceInfo()');
  var planned = money('expense-planned', 'planned_amount', 'סכום מתוכנן', plannedVal, isPlanned,
    'updatePlannedDiff(); updatePerformanceInfo()');

  // הראשי תמיד ראשון, כדי שהאצבע תיפול על השדה הנכון
  return '<div class="form-row money-row">' + (isPlanned ? planned + agreed : agreed + planned) + '</div>' +
    '<div class="diff-line" id="planned-diff"></div>' +
    '<div id="amount-mismatch"></div>';
}

/**
 * החלפת סטטוס לא מוחקת כלום — היא רק מחליפה איזה שדה ראשי,
 * ומציעה להעביר סכום שנמצא בשדה הלא נכון.
 */
function refreshAmountField() {
  var agreedEl = document.getElementById('expense-amount');
  var plannedEl = document.getElementById('expense-planned');
  var kept = { agreed: agreedEl ? agreedEl.value : '', planned: plannedEl ? plannedEl.value : '' };
  var wrap = document.getElementById('amount-field');
  if (!wrap) return;
  wrap.innerHTML = renderAmountFieldHtml(null);
  document.getElementById('expense-amount').value = kept.agreed;
  document.getElementById('expense-planned').value = kept.planned;
  updatePlannedDiff();
}

/** מציע בלחיצה אחת להעביר סכום מהשדה הלא נכון לנכון. לא עושה כלום לבד. */
function updateAmountMismatch() {
  var out = document.getElementById('amount-mismatch');
  if (!out) return;
  var isPlanned = expenseSheetState.statusChoice === STATUS.PLANNED;
  var agreed = Number((document.getElementById('expense-amount') || {}).value) || 0;
  var planned = Number((document.getElementById('expense-planned') || {}).value) || 0;

  if (isPlanned && agreed > 0) {
    out.innerHTML = '<div class="form-hint warn">' + formatCurrency(agreed) + ' רשומים כסכום מוסכם, אבל הסטטוס "מתוכנן". ' +
      '<button type="button" class="btn-ghost" onclick="moveAmountToPlanned()">העבר לסכום מתוכנן</button></div>';
  } else if (!isPlanned && agreed === 0 && planned > 0) {
    out.innerHTML = '<div class="form-hint">הסטטוס "סוכם" אבל אין סכום מוסכם. ' +
      '<button type="button" class="btn-ghost" onclick="moveAmountToAgreed()">השתמש ב-' + formatCurrency(planned) + '</button></div>';
  } else {
    out.innerHTML = '';
  }
}

function moveAmountToPlanned() {
  var a = document.getElementById('expense-amount'), pl = document.getElementById('expense-planned');
  pl.value = a.value; a.value = '';
  updatePlannedDiff();
}
function moveAmountToAgreed() {
  var a = document.getElementById('expense-amount'), pl = document.getElementById('expense-planned');
  a.value = pl.value;
  updatePlannedDiff();
  refreshPaymentSummary();
}

function renderStatusFieldHtml() {
  var s = expenseSheetState;
  var options = [STATUS.PLANNED, STATUS.AGREED];
  if (isSimplePaymentMode()) options.push(STATUS.PAID);
  else if (s.statusChoice === STATUS.PAID) s.statusChoice = s.originalManual || STATUS.AGREED;
  return '' +
    '<label class="form-label">סטטוס</label>' +
    '<div class="segmented" id="status-segmented">' +
      options.map(function (o) {
        return '<button type="button" data-status="' + o + '" class="' + (s.statusChoice === o ? 'active' : '') + '" onclick="setStatusSegment(this)">' + o + '</button>';
      }).join('') +
    '</div>' +
    (!isSimplePaymentMode() ? '<div class="form-hint">"שולם" ו"שולם חלקית" מחושבים אוטומטית מהתשלומים.</div>' : '');
}

function getQuickPayValues() {
  var due = document.getElementById('qp-due');
  var method = document.getElementById('qp-method');
  return { due: due ? due.value : undefined, method: method ? method.value : undefined };
}

function renderQuickPayHtml(kept) {
  var s = expenseSheetState;
  if (!isSimplePaymentMode()) {
    var paid = s.payments.filter(function (p) { return p.is_paid; }).reduce(function (sum, p) { return sum + Number(p.amount); }, 0);
    return '<div class="split-note">ההוצאה מחולקת ל-' + s.payments.length + ' תשלומים · שולם ' + formatCurrency(paid) +
      '<button type="button" class="btn-ghost" onclick="openPaymentsArea()">לניהול התשלומים</button></div>';
  }
  var single = singlePayment();
  var due = kept.due !== undefined ? kept.due : toDateInputValue(single ? single.due_date : '');
  var method = kept.method !== undefined ? kept.method : (single ? single.payment_method_id : '');
  var html = '<div class="form-row">' +
    '<div class="form-group"><label class="form-label" for="qp-due">מועד תשלום</label>' +
      '<input class="form-input" id="qp-due" type="date" value="' + due + '"></div>';
  if (s.statusChoice === STATUS.PAID) {
    html += '<div class="form-group"><label class="form-label" for="qp-method">איך שולם?</label>' +
      '<select class="form-input form-select" id="qp-method">' + methodOptionsHtml(method) + '</select></div>';
  }
  return html + '</div>';
}

function setStatusSegment(btn) {
  var kept = getQuickPayValues();
  expenseSheetState.statusChoice = btn.getAttribute('data-status');
  document.getElementById('status-field').innerHTML = renderStatusFieldHtml();
  document.getElementById('quick-pay').innerHTML = renderQuickPayHtml(kept);
  refreshAmountField();
}

function toggleExpenseDetails(forceOpen) {
  var el = document.getElementById('expense-extra-details');
  var open = forceOpen === true ? true : el.hidden;
  el.hidden = !open;
  document.getElementById('details-caret').textContent = open ? '▴' : '▾';
  var t = document.querySelector('[aria-controls="expense-extra-details"]');
  if (t) t.setAttribute('aria-expanded', String(open));
}

function openPaymentsArea() {
  var el = document.getElementById('payments-section');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/** Planned vs Actual (סעיף 59) — בלי אחוז כשאין סכום מתוכנן */
function updatePlannedDiff() {
  updateAmountMismatch();
  var out = document.getElementById('planned-diff');
  if (!out) return;
  var planned = Number((document.getElementById('expense-planned') || {}).value) || 0;
  var agreed = Number((document.getElementById('expense-amount') || {}).value) || 0;
  if (!planned || !agreed) { out.textContent = ''; return; }
  var diff = agreed - planned;
  var pct = Math.round(diff / planned * 100);
  out.textContent = diff === 0
    ? 'בדיוק לפי המתוכנן'
    : 'הפרש מהמתוכנן: ' + (diff > 0 ? '+' : '') + formatCurrency(diff) + ' (' + (diff > 0 ? '+' : '') + pct + '%)';
}

/* ---- Payments & deposits (inside "פרטים נוספים") ---- */
function currentAgreedInput() {
  var el = document.getElementById('expense-amount');
  return el ? (Number(el.value) || 0) : Number(expenseSheetState.originalAgreed) || 0;
}

function paymentSummaryHtml() {
  var agreed = currentAgreedInput();
  var paid = expenseSheetState.payments.filter(function (p) { return p.is_paid; }).reduce(function (s, p) { return s + Number(p.amount); }, 0);
  return '<div class="money-summary" id="payment-summary">' +
    '<span>סה"כ <b>' + formatCurrency(agreed) + '</b></span>' +
    '<span>שולם <b>' + formatCurrency(paid) + '</b></span>' +
    '<span>נותר <b>' + formatCurrency(agreed - paid) + '</b></span>' +
  '</div>';
}
function refreshPaymentSummary() {
  var el = document.getElementById('payment-summary');
  if (el) el.outerHTML = paymentSummaryHtml();
  // אותה שורה מופיעה גם למעלה בטופס, כדי ש"סוכם / שולם / נותר" יהיה גלוי בלי לפתוח "פרטים נוספים"
  var top = document.getElementById('expense-money-summary');
  if (top) top.innerHTML = paymentSummaryHtml().replace('id="payment-summary"', 'id="payment-summary-top"');
}

function renderPaymentsSectionHtml() {
  var s = expenseSheetState;
  if (!s.expenseId) {
    return '<div class="sub-title">תשלומים ומקדמות</div>' +
      '<div class="form-hint">אפשר לפצל לכמה תשלומים ומקדמות אחרי שמירת ההוצאה. לתשלום אחד מספיק "מועד תשלום" למעלה.</div>';
  }
  var html = '<div class="sub-title">תשלומים ומקדמות</div>' + paymentSummaryHtml();
  s.payments.forEach(function (p) {
    if (s.editingPayment === p.payment_id) { html += renderPaymentEditorHtml(p); return; }
    var subParts = [];
    if (p.method_name) subParts.push(escapeHtml(p.method_name));
    if (p.is_paid && p.paid_date) subParts.push('שולם ב-' + formatDate(p.paid_date));
    if (p.note) subParts.push(escapeHtml(p.note));
    html += '<div class="payment-line" role="button" tabindex="0" onclick="editPayment(\'' + p.payment_id + '\')">' +
      '<div class="pl-main">' + (p.due_date ? formatDate(p.due_date) : 'ללא מועד') + ' ' + statusChipHtml(p.display_status) +
        (subParts.length ? '<div class="pl-sub">' + subParts.join(' · ') + '</div>' : '') +
      '</div>' +
      '<div class="pl-amount">' + money(p.amount) + '</div>' +
    '</div>';
  });
  if (s.editingPayment === 'new') html += renderPaymentEditorHtml(null);
  else html += '<button type="button" class="btn btn-secondary btn-small" style="margin-top:10px;" onclick="editPayment(\'new\')">+ הוסף תשלום / מקדמה</button>';
  return html;
}

function renderPaymentEditorHtml(p) {
  var s = expenseSheetState;
  var paid = s.payments.filter(function (x) { return x.is_paid; }).reduce(function (sum, x) { return sum + Number(x.amount); }, 0);
  var suggested = p ? p.amount : Math.max(0, currentAgreedInput() - s.payments.reduce(function (sum, x) { return sum + Number(x.amount); }, 0));
  var status = p ? p.payment_status : STATUS.PLANNED;
  var noEnter = ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();}"';
  return '' +
    '<div class="pay-editor" id="pay-editor">' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label" for="pe-amount">סכום<span class="required">*</span></label>' +
          '<div class="money-input"><input class="form-input" id="pe-amount" type="number" inputmode="numeric" min="0" step="1" value="' + (suggested || '') + '"' + noEnter + '></div></div>' +
        '<div class="form-group"><label class="form-label" for="pe-due">מועד</label>' +
          '<input class="form-input" id="pe-due" type="date" value="' + toDateInputValue(p ? p.due_date : '') + '"' + noEnter + '></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">סטטוס</label>' +
        '<div class="segmented" id="pe-status">' +
          [STATUS.PLANNED, STATUS.PENDING, STATUS.PAID].map(function (o) {
            return '<button type="button" data-status="' + o + '" class="' + (status === o ? 'active' : '') + '" onclick="setPaymentStatus(this)">' + (o === STATUS.PENDING ? 'ממתין' : o) + '</button>';
          }).join('') +
        '</div></div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label" for="pe-method">אמצעי תשלום</label>' +
          '<select class="form-input form-select" id="pe-method">' + methodOptionsHtml(p ? p.payment_method_id : '') + '</select></div>' +
        '<div class="form-group" id="pe-paid-wrap" style="' + (status === STATUS.PAID ? '' : 'display:none;') + '"><label class="form-label" for="pe-paid">תאריך ששולם</label>' +
          '<input class="form-input" id="pe-paid" type="date" value="' + toDateInputValue(p && p.paid_date ? p.paid_date : todayInputValue()) + '"' + noEnter + '></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label" for="pe-note">הערה</label>' +
        '<input class="form-input" id="pe-note" value="' + escapeHtml(p ? p.note : '') + '" placeholder="לדוגמה: מקדמה"' + noEnter + '></div>' +
      '<div class="btn-block-row">' +
        '<button type="button" class="btn btn-gold btn-small" id="pe-save" onclick="savePaymentFromEditor()">שמור תשלום</button>' +
        '<button type="button" class="btn btn-secondary btn-small" onclick="editPayment(null)">ביטול</button>' +
      '</div>' +
      (p ? '<button type="button" class="btn-ghost" style="color:var(--clay);" id="pe-delete" onclick="deletePaymentFromEditor(\'' + p.payment_id + '\')">מחק תשלום</button>' : '') +
      (paid > currentAgreedInput() ? '<div class="form-hint">שימי לב: סכום התשלומים ששולמו גבוה מסכום ההוצאה.</div>' : '') +
    '</div>';
}

function editPayment(id) {
  expenseSheetState.editingPayment = id;
  document.getElementById('payments-section').innerHTML = renderPaymentsSectionHtml();
  var first = document.getElementById('pe-amount');
  if (first) first.focus();
}

function setPaymentStatus(btn) {
  document.querySelectorAll('#pe-status button').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('pe-paid-wrap').style.display = btn.getAttribute('data-status') === STATUS.PAID ? '' : 'none';
}

function rerenderPaymentAreas() {
  var kept = getQuickPayValues();
  document.getElementById('status-field').innerHTML = renderStatusFieldHtml();
  document.getElementById('quick-pay').innerHTML = renderQuickPayHtml(kept);
  document.getElementById('payments-section').innerHTML = renderPaymentsSectionHtml();
}

function savePaymentFromEditor() {
  var btn = document.getElementById('pe-save');
  if (btn.disabled) return;
  var amount = Number(document.getElementById('pe-amount').value);
  if (!(amount > 0)) { showToast('יש להזין סכום תשלום.', true); return; }
  var statusBtn = document.querySelector('#pe-status button.active');
  var status = statusBtn ? statusBtn.getAttribute('data-status') : STATUS.PLANNED;
  var editing = expenseSheetState.editingPayment;

  var payload = {
    expense_id: expenseSheetState.expenseId,
    amount: amount,
    due_date: document.getElementById('pe-due').value,
    payment_status: status,
    payment_method_id: document.getElementById('pe-method').value,
    paid_date: status === STATUS.PAID ? document.getElementById('pe-paid').value : '',
    note: document.getElementById('pe-note').value
  };
  if (editing && editing !== 'new') payload.payment_id = editing;

  btn.disabled = true; btn.textContent = 'שומר...';
  callServer('savePayment', payload).then(function (saved) {
    var list = expenseSheetState.payments;
    var idx = list.map(function (p) { return p.payment_id; }).indexOf(saved.payment_id);
    if (idx === -1) list.push(saved); else list[idx] = saved;
    expenseSheetState.paymentsChanged = true;
    expenseSheetState.editingPayment = null;
    rerenderPaymentAreas();
    showToast('נשמר בהצלחה');
  }).catch(function (err) {
    showToast(err, true);
    btn.disabled = false; btn.textContent = 'שמור תשלום';
  });
}

function deletePaymentFromEditor(paymentId) {
  var btn = document.getElementById('pe-delete');
  if (!btn.getAttribute('data-armed')) {
    // אישור בלחיצה שנייה — בלי לסגור את טופס ההוצאה
    btn.setAttribute('data-armed', '1');
    btn.textContent = 'לחצי שוב כדי למחוק את התשלום';
    return;
  }
  btn.disabled = true;
  callServer('archivePayment', paymentId).then(function () {
    expenseSheetState.payments = expenseSheetState.payments.filter(function (p) { return p.payment_id !== paymentId; });
    expenseSheetState.paymentsChanged = true;
    expenseSheetState.editingPayment = null;
    rerenderPaymentAreas();
    showToast('התשלום נמחק');
  }).catch(function (err) { showToast(err, true); btn.disabled = false; });
}

/* ---- Category autocomplete ---- */
function onCategorySearch(query) {
  var list = document.getElementById('category-list');
  var q = (query || '').trim().toLowerCase();
  var matches = appState.cache.categories.filter(function (c) { return c.name.toLowerCase().indexOf(q) !== -1; });

  // מעבירים ל-onclick רק מזהים (UUID). שמות עם גרש (למשל DORON'S) שוברים מחרוזת JS בתוך onclick.
  var html = matches.map(function (c) {
    return '<div class="autocomplete-item" onclick="selectCategory(\'' + c.category_id + '\')">' + escapeHtml(c.name) + '</div>';
  }).join('');

  if (q && !appState.cache.categories.some(function (c) { return c.name.toLowerCase() === q; })) {
    html += '<div class="autocomplete-item add-new" onclick="createCategoryInline()">+ הוסף קטגוריה חדשה: "' + escapeHtml(query.trim()) + '"</div>';
  }
  list.innerHTML = html;
  list.style.display = html ? 'block' : 'none';
}

function selectCategory(id) {
  var wasArtist = !!expenseSheetState.whomIsArtist; // סוג השדה שמוצג כרגע בפועל
  if (expenseSheetState.categoryId !== id) expenseSheetState.subcategoryId = null; // החלפת קטגוריה מנקה את תת-הקטגוריה
  expenseSheetState.categoryId = id;
  document.getElementById('category-search').value = categoryNameById(id);
  document.getElementById('category-list').style.display = 'none';
  // מעבר בין "אמנים" לקטגוריה רגילה — מנקים את הבחירה מהסוג השני, כדי שלא יישמרו גם vendor_id וגם artist_id
  var isArtist = isCategoryArtists(id);
  if (isArtist) expenseSheetState.vendorId = null; else expenseSheetState.artistId = null;
  if (wasArtist !== isArtist) {
    document.getElementById('whom-field').innerHTML = renderWhomFieldHtml();
  }
  document.getElementById('subcategory-field').innerHTML = renderSubcategoryFieldHtml();
  refreshCoverageField();
  document.getElementById('performance-field').innerHTML = renderPerformanceFieldHtml(null);
  updatePerformanceInfo();
}

/* ---- Subcategory (אופציונלי; לא קיים בקטגוריית "אמנים") ---- */
function categoryById(id) {
  return appState.cache.categories.filter(function (c) { return c.category_id === id; })[0] || null;
}
function subcategoriesOf(categoryId) {
  var c = categoryById(categoryId);
  return (c && c.subcategories) || [];
}
function subcategoryNameById(categoryId, subId) {
  var sc = subcategoriesOf(categoryId).filter(function (x) { return x.subcategory_id === subId; })[0];
  return sc ? sc.name : '';
}

function renderSubcategoryFieldHtml() {
  var s = expenseSheetState;
  // "אמנים" נשארת בדיוק כמו שהייתה — בלי שדה תת-קטגוריה
  if (!s.categoryId || isCategoryArtists(s.categoryId)) return '';
  return '<div class="form-group nested-field">' +
    '<label class="form-label" for="subcategory-search">תת-קטגוריה של ' + escapeHtml(categoryNameById(s.categoryId)) + ' <span class="optional">(לא חובה)</span></label>' +
    '<div class="autocomplete-wrap">' +
      '<input class="form-input" id="subcategory-search" placeholder="בחר או הקלד תת-קטגוריה" autocomplete="off" ' +
        'value="' + escapeHtml(subcategoryNameById(s.categoryId, s.subcategoryId)) + '" ' +
        'oninput="expenseSheetState.subcategoryId = null; refreshCoverageField(); onSubcategorySearch(this.value)" onfocus="onSubcategorySearch(this.value)">' +
      '<div id="subcategory-list" class="autocomplete-list" style="display:none;"></div>' +
    '</div></div>';
}

function onSubcategorySearch(query) {
  var list = document.getElementById('subcategory-list');
  var subs = subcategoriesOf(expenseSheetState.categoryId);
  var q = (query || '').trim().toLowerCase();
  var matches = subs.filter(function (x) { return x.name.toLowerCase().indexOf(q) !== -1; });
  var html = matches.map(function (x) {
    return '<div class="autocomplete-item" onclick="selectSubcategory(\'' + x.subcategory_id + '\')">' + escapeHtml(x.name) + '</div>';
  }).join('');
  if (q && !subs.some(function (x) { return x.name.toLowerCase() === q; })) {
    html += '<div class="autocomplete-item add-new" onclick="createSubcategoryInline()">+ הוסף תת-קטגוריה חדשה: "' + escapeHtml(query.trim()) + '"</div>';
  }
  list.innerHTML = html;
  list.style.display = html ? 'block' : 'none';
}

function selectSubcategory(id) {
  expenseSheetState.subcategoryId = id;
  document.getElementById('subcategory-search').value = subcategoryNameById(expenseSheetState.categoryId, id);
  document.getElementById('subcategory-list').style.display = 'none';
  refreshCoverageField();
}

function createSubcategoryInline() {
  var name = document.getElementById('subcategory-search').value.trim();
  var categoryId = expenseSheetState.categoryId;
  if (!name || !categoryId) return;
  callServer('saveSubcategory', { category_id: categoryId, name: name }).then(function (created) {
    var c = categoryById(categoryId);
    if (c) {
      c.subcategories = c.subcategories || [];
      if (!c.subcategories.some(function (x) { return x.subcategory_id === created.subcategory_id; })) c.subcategories.push(created);
    }
    selectSubcategory(created.subcategory_id);
    showToast('נשמר בהצלחה');
  }).catch(function (err) { showToast(err, true); });
}

function createCategoryInline() {
  var name = document.getElementById('category-search').value.trim();
  if (!name) return;
  callServer('saveCategory', { name: name }).then(function (created) {
    if (!appState.cache.categories.some(function (c) { return c.category_id === created.category_id; })) {
      appState.cache.categories.push(Object.assign({ subcategories: [] }, created));
    }
    selectCategory(created.category_id);
    showToast('נשמר בהצלחה');
  }).catch(function (err) { showToast(err, true); });
}

/* ---- Vendor / Artist ("who") autocomplete ---- */
function onWhomSearch(query) {
  var isArtist = expenseSheetState.whomIsArtist;
  var source = isArtist ? appState.cache.artists : appState.cache.vendors;
  var q = (query || '').trim().toLowerCase();
  var matches = source.filter(function (x) { return x.name.toLowerCase().indexOf(q) !== -1; });
  var list = document.getElementById('whom-list');

  var idKey = isArtist ? 'artist_id' : 'vendor_id';
  var html = matches.map(function (x) {
    return '<div class="autocomplete-item" onclick="selectWhom(\'' + x[idKey] + '\')">' + escapeHtml(x.name) + '</div>';
  }).join('');

  if (q && !source.some(function (x) { return x.name.toLowerCase() === q; })) {
    var addLabel = isArtist ? 'הוספת אמן למערכת' : 'הוספת ספק למערכת';
    html += '<div class="autocomplete-item add-new" onclick="createWhomInline()">+ ' + addLabel + ': "' + escapeHtml(query.trim()) + '"</div>';
  }
  list.innerHTML = html;
  list.style.display = html ? 'block' : 'none';
}

function selectWhom(id) {
  var isArtist = expenseSheetState.whomIsArtist;
  if (isArtist) expenseSheetState.artistId = id; else expenseSheetState.vendorId = id;
  document.getElementById('whom-search').value = isArtist ? artistNameById(id) : vendorNameById(id);
  document.getElementById('whom-list').style.display = 'none';
}

/** הקלדה בשדה מבטלת בחירה קודמת — אחרת טקסט חדש יישמר עם המזהה הישן */
function clearWhomSelection() {
  if (expenseSheetState.whomIsArtist) expenseSheetState.artistId = null;
  else expenseSheetState.vendorId = null;
}

function createWhomInline() {
  var name = document.getElementById('whom-search').value.trim();
  if (!name) return;
  var isArtist = expenseSheetState.whomIsArtist;
  callServer(isArtist ? 'saveArtist' : 'saveVendor', { name: name }).then(function (created) {
    if (isArtist) { appState.cache.artists.push(created); selectWhom(created.artist_id); }
    else { appState.cache.vendors.push(created); selectWhom(created.vendor_id); }
    showToast('נשמר בהצלחה');
  }).catch(function (err) { showToast(err, true); });
}

/* ---- Submit expense form ---- */
function submitExpenseForm(e) {
  e.preventDefault();
  var btn = document.getElementById('expense-save-btn');
  if (btn.disabled) return;
  var s = expenseSheetState;

  if (!s.categoryId) {
    showToast('יש לבחור קטגוריה מהרשימה.', true);
    return;
  }
  var subText = (document.getElementById('subcategory-search') || {}).value;
  if (subText && subText.trim() && !s.subcategoryId) {
    showToast('תת-קטגוריה: יש לבחור מהרשימה, להוסיף חדשה, או למחוק את הטקסט.', true);
    return;
  }
  var whomText = (document.getElementById('whom-search') || {}).value;
  var whomId = isCategoryArtists(s.categoryId) ? s.artistId : s.vendorId;
  if (whomText && whomText.trim() && !whomId) {
    showToast('יש לבחור מהרשימה או להוסיף חדש.', true);
    return;
  }

  btn.disabled = true; btn.textContent = 'שומר...';
  var form = e.target;
  var isPaidChoice = s.statusChoice === STATUS.PAID;
  var payload = {
    event_id: s.eventId,
    name: form.name.value,
    category_id: s.categoryId,
    subcategory_id: isCategoryArtists(s.categoryId) ? '' : (s.subcategoryId || ''),
    agreed_amount: form.agreed_amount.value,
    planned_amount: form.planned_amount.value,
    vendor_id: s.vendorId || '',
    artist_id: s.artistId || '',
    paid_by: form.paid_by.value,
    // "שולם" אינו סטטוס ידני — נשמר כ"סוכם" והתשלום עצמו מסומן כשולם
    manual_status: isPaidChoice ? STATUS.AGREED : s.statusChoice,
    expense_date: form.expense_date.value,
    internal_notes: form.internal_notes.value,
    // מידע תפעולי בלבד — לא משנה שום סכום
    coverage: s.coverageOn ? s.coverage : []
  };
  var startEl = document.getElementById('perf-start'), endEl = document.getElementById('perf-end');
  if (startEl && endEl) {
    var startVal = startEl.value, endVal = endEl.value;
    if ((startVal && !endVal) || (!startVal && endVal)) {
      showToast('שעות הופעה: צריך למלא גם התחלה וגם סיום, או להשאיר ריק.', true);
      btn.disabled = false; btn.textContent = 'שמור הוצאה';
      return;
    }
    payload.performance_start_time = startVal;
    payload.performance_end_time = endVal;
  } else {
    payload.performance_start_time = '';
    payload.performance_end_time = '';
  }
  if (isSimplePaymentMode()) {
    var qp = getQuickPayValues();
    payload.simple_payment = {
      is_paid: isPaidChoice,
      due_date: qp.due || '',
      payment_method_id: isPaidChoice ? (qp.method || '') : ''
    };
  }

  var call = s.expenseId
    ? callServer('updateExpense', Object.assign({ expense_id: s.expenseId }, payload))
    : callServer('createExpense', payload);

  call.then(function () {
    showToast('נשמר בהצלחה');
    s.paymentsChanged = false;
    closeBottomSheet();
    refreshCurrent();
  }).catch(function (err) {
    showToast(err, true);
    btn.disabled = false; btn.textContent = 'שמור הוצאה';
  });
}

function confirmArchiveExpense(expenseId) {
  openConfirmDialog('למחוק את ההוצאה?', 'הפעולה תסתיר אותה מהאירוע אך תשמור את הרשומה לצורכי היסטוריה.', function () {
    callServer('archiveExpense', expenseId).then(function () {
      showToast('ההוצאה נמחקה');
      closeBottomSheet();
      refreshCurrent();
    }).catch(function (err) { showToast(err, true); });
  });
}

/* ============================================================
   INCOME — Bottom Sheet (סעיף 58)
   ============================================================ */
function openIncomeSheet(eventId, incomeId) {
  var existing = incomeId ? (window.__currentEventIncome || []).filter(function (x) { return x.income_id === incomeId; })[0] : null;
  var body = '' +
    '<form id="income-form" onsubmit="submitIncomeForm(event, \'' + eventId + '\', \'' + (incomeId || '') + '\')">' +
      '<div class="form-group"><label class="form-label" for="inc-name">שם / סוג הכנסה<span class="required">*</span></label>' +
        '<input class="form-input" id="inc-name" name="name" required maxlength="120" value="' + escapeHtml(existing ? existing.name : '') + '" placeholder="לדוגמה: כרטיסים מוקדמים"></div>' +
      '<label class="check-row" style="border:none; margin-bottom:8px;">' +
        '<input type="checkbox" id="inc-ticket"' + (existing && existing.is_ticket_income ? ' checked' : '') + ' onchange="updateIncomeLabels()">' +
        '<span class="cr-main">הכנסה ממכירת כרטיסים</span></label>' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label" for="inc-qty" id="inc-qty-label">כמות<span class="required">*</span></label>' +
          '<input class="form-input" id="inc-qty" name="quantity" type="number" inputmode="numeric" min="1" step="1" required value="' + (existing ? existing.quantity : '1') + '" oninput="updateIncomeTotal()"></div>' +
        '<div class="form-group"><label class="form-label" for="inc-price" id="inc-price-label">מחיר ליחידה<span class="required">*</span></label>' +
          '<div class="money-input"><input class="form-input" id="inc-price" name="unit_price" type="number" inputmode="decimal" min="0" step="any" required value="' + (existing ? existing.unit_price : '') + '" placeholder="0" oninput="updateIncomeTotal()"></div></div>' +
      '</div>' +
      '<div class="live-total"><span>סה"כ</span><b id="inc-total">' + money(existing ? existing.total_amount : 0) + '</b></div>' +
      '<div class="form-group"><label class="form-label" for="inc-notes">הערות</label>' +
        '<textarea class="form-textarea" id="inc-notes" name="notes">' + escapeHtml(existing ? existing.notes : '') + '</textarea></div>' +
      '<button class="btn btn-gold" type="submit" id="income-save-btn">שמור הכנסה</button>' +
      (existing ? '<button type="button" class="btn btn-danger-ghost" style="margin-top:10px;" onclick="confirmArchiveIncome(\'' + existing.income_id + '\')">מחק הכנסה</button>' : '') +
    '</form>';
  openBottomSheet(existing ? 'עריכת הכנסה' : 'הכנסה חדשה', body);
  updateIncomeLabels();
}

/** סימון "הכנסה ממכירת כרטיסים" משנה רק את התוויות; החישוב נשאר בשרת */
function updateIncomeLabels() {
  var isTickets = document.getElementById('inc-ticket').checked;
  document.getElementById('inc-qty-label').innerHTML = (isTickets ? 'כמות כרטיסים' : 'כמות') + '<span class="required">*</span>';
  document.getElementById('inc-price-label').innerHTML = (isTickets ? 'מחיר לכרטיס' : 'מחיר ליחידה') + '<span class="required">*</span>';
}

function updateIncomeTotal() {
  var q = Number(document.getElementById('inc-qty').value) || 0;
  var p = Number(document.getElementById('inc-price').value) || 0;
  document.getElementById('inc-total').innerHTML = money(Math.round(q * p * 100) / 100);
}

function submitIncomeForm(e, eventId, incomeId) {
  e.preventDefault();
  var btn = document.getElementById('income-save-btn');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'שומר...';
  var form = e.target;
  var payload = {
    event_id: eventId, name: form.name.value, quantity: form.quantity.value,
    unit_price: form.unit_price.value, notes: form.notes.value,
    is_ticket_income: document.getElementById('inc-ticket').checked
  };
  if (incomeId) payload.income_id = incomeId;
  callServer('saveIncome', payload).then(function () {
    showToast('נשמר בהצלחה');
    closeBottomSheet();
    refreshCurrent();
  }).catch(function (err) {
    showToast(err, true);
    btn.disabled = false; btn.textContent = 'שמור הכנסה';
  });
}

function confirmArchiveIncome(incomeId) {
  openConfirmDialog('למחוק את שורת ההכנסה?', 'השורה תוסתר מהאירוע אך תישמר לצורכי היסטוריה.', function () {
    callServer('archiveIncome', incomeId).then(function () {
      showToast('ההכנסה נמחקה');
      closeBottomSheet();
      refreshCurrent();
    }).catch(function (err) { showToast(err, true); });
  });
}

/* ============================================================
   CATEGORIES SCREEN

  refreshCategories().then(function (categories) {

      setScreen(emptyStateHtml('', 'אין עדיין קטגוריות', null, '') +
        '<button class="btn btn-secondary" style="margin-top:20px;" onclick="openCategoryCreateSheet()">+ הוסף קטגוריה</button>');
      return;
    }
    setScreen('' +
      '<p class="screen-intro">כל קטגוריה מחולקת לתתי-קטגוריות. לחצי על קטגוריה כדי לפתוח אותה, ועל תת-קטגוריה כדי לערוך.</p>' +
      '<div class="list-toolbar">' +
        '<input class="form-input" id="cat-search" type="search" aria-label="חיפוש קטגוריה או תת-קטגוריה" ' +
          'placeholder="חיפוש קטגוריה או תת-קטגוריה" oninput="renderCategoryList()">' +
        '<button type="button" class="btn-ghost" id="cat-expand-all" onclick="toggleAllCategories()">פתח הכל</button>' +
      '</div>' +
      '<div class="list-count" id="cat-count" role="status"></div>' +
      '<div class="cat-list" id="cat-list"></div>' +
      '<button class="btn btn-secondary" style="margin-top:20px;" onclick="openCategoryCreateSheet()">+ הוסף קטגוריה</button>');
    renderCategoryList();
  }).catch(function (err) { renderError(err, renderCategoriesScreen); });
}

/**
 * מצייר את רשימת הקטגוריות לפי החיפוש.
 * חיפוש מתאים גם לשם קטגוריה וגם לשם תת-קטגוריה, ומרחיב אוטומטית
 * קטגוריה שההתאמה נמצאה בתוכה — אחרת אי אפשר לראות מה נמצא.
 */
function renderCategoryList() {
  var input = document.getElementById('cat-search');
  var q = input ? input.value.trim().toLowerCase() : '';
  var all = window.__allCategories || [];
  var openAll = !!window.__catOpenAll;

  var rows = all.map(function (c) {
    var subs = c.subcategories || [];
    var nameHit = String(c.name).toLowerCase().indexOf(q) !== -1;
    var hitSubs = q ? subs.filter(function (sc) { return String(sc.name).toLowerCase().indexOf(q) !== -1; }) : subs;
    return { cat: c, subs: subs, visibleSubs: (q && !nameHit) ? hitSubs : subs,
             matches: !q || nameHit || hitSubs.length > 0, forceOpen: !!q && !nameHit && hitSubs.length > 0 };
  }).filter(function (r) { return r.matches; });

  var count = document.getElementById('cat-count');
  if (count) {
    var subTotal = rows.reduce(function (n, r) { return n + r.subs.length; }, 0);
    count.textContent = rows.length === 0 ? 'לא נמצאו התאמות'
      : rows.length + (rows.length === 1 ? ' קטגוריה' : ' קטגוריות') + ' · ' + subTotal + ' תתי-קטגוריות';
  }

  var list = document.getElementById('cat-list');
  if (!list) return;
  if (!rows.length) {
    list.innerHTML = emptyStateHtml('', 'לא נמצאו קטגוריות או תתי-קטגוריות תואמות', null, '', true);
    return;
  }

  list.innerHTML = rows.map(function (r, i) {
    var c = r.cat, subs = r.visibleSubs;
    var countText = r.subs.length === 1 ? 'תת-קטגוריה אחת'
      : r.subs.length ? r.subs.length + ' תתי-קטגוריות' : 'אין עדיין תתי-קטגוריות';

    // "אמנים" שומרת על ההתנהגות המיוחדת: בלי תתי-קטגוריות, עם קישור לרשימת האמנים
    if (isCategoryArtists(c.category_id)) {
      return '<section class="cat-card is-artists">' +
        '<div class="cat-head">' +
          '<span class="cat-icon" aria-hidden="true">' + ICON_MIC + '</span>' +
          '<div class="cat-title-wrap"><h2 class="cat-name">' + escapeHtml(c.name) + '</h2>' +
            '<span class="cat-meta">בלי תתי-קטגוריות · בוחרים אמן מתוך רשימת האמנים</span></div>' +
          '<button class="icon-btn" onclick="navigate(\'artists\')" aria-label="מעבר לרשימת האמנים">' + ICON_ARROW + '</button>' +
        '</div></section>';
    }

    var isOpen = openAll || r.forceOpen;
    return '<section class="cat-card' + (isOpen ? ' open' : '') + '" id="cat-card-' + i + '">' +
      '<div class="cat-head">' +
        '<button class="cat-toggle" aria-expanded="' + isOpen + '" aria-controls="cat-subs-' + i + '" onclick="toggleCategorySubs(' + i + ')">' +
          '<span class="cat-icon" aria-hidden="true">' + ICON_FOLDER + '</span>' +
          '<span class="cat-title-wrap"><span class="cat-name">' + escapeHtml(c.name) + '</span>' +
            '<span class="cat-badge">' + countText + '</span></span>' +
          '<span class="cat-chevron" aria-hidden="true">' + ICON_CHEVRON + '</span>' +
        '</button>' +
        '<button class="icon-btn" onclick="openCategoryEditSheet(\'' + c.category_id + '\')" aria-label="עריכת הקטגוריה ' + escapeHtml(c.name) + '">' + ICON_EDIT + '</button>' +
      '</div>' +
      '<div class="cat-subs" id="cat-subs-' + i + '"' + (isOpen ? '' : ' hidden') + '>' +
        '<div class="cat-subs-label">תתי-קטגוריות של ' + escapeHtml(c.name) + '</div>' +
        (subs.length ? subs.map(function (sc) {
          // כל השורה לחיצה לעריכה — אזור מגע גדול יותר, ובלי אייקון עיפרון על כל שורה
          return '<button type="button" class="sub-row" ' +
            'aria-label="עריכת תת-הקטגוריה ' + escapeHtml(sc.name) + '" ' +
            'onclick="openSubcategorySheet(\'' + c.category_id + '\', \'' + sc.subcategory_id + '\')">' +
            '<span class="sub-branch" aria-hidden="true"></span>' +
            '<span class="sub-name">' + escapeHtml(sc.name) + '</span>' +
            '<span class="sub-edit" aria-hidden="true">' + ICON_EDIT + '</span>' +
          '</button>';
        }).join('') : '<div class="sub-empty">עדיין אין כאן תתי-קטגוריות.</div>') +
        '<button class="add-sub-btn" onclick="openSubcategorySheet(\'' + c.category_id + '\', null)">+ תת-קטגוריה חדשה</button>' +
      '</div>' +
    '</section>';
  }).join('');
}

/** אחת פתוחה בכל פעם — אחרת המסך הופך לרשימה שאי אפשר לסרוק */
function toggleCategorySubs(i) {
  var el = document.getElementById('cat-subs-' + i);
  if (!el) return;
  var opening = el.hasAttribute('hidden');

  if (opening && !window.__catOpenAll) {
    document.querySelectorAll('.cat-subs:not([hidden])').forEach(function (other) {
      other.setAttribute('hidden', '');
      var card = other.closest('.cat-card');
      if (card) card.classList.remove('open');
      var t = document.querySelector('[aria-controls="' + other.id + '"]');
      if (t) t.setAttribute('aria-expanded', 'false');
    });
  }

  if (opening) el.removeAttribute('hidden'); else el.setAttribute('hidden', '');

  document.querySelector('#cat-card-' + i + ' .cat-toggle').setAttribute('aria-expanded', String(opening));

/** כרטיס ספק/אמן: אות ראשונה בעיגול, שם, טלפון, וסיכום שימוש */
function personCardHtml(p, kind) {
  var isArtist = kind === 'artist';
  var title = isArtist ? (p.display_name || p.stage_name || p.name || p.real_name || '') : p.name;
  var initial = String(title || '?').trim().charAt(0);
  var usage = p.events_count
    ? (p.events_count === 1 ? 'אירוע אחד' : p.events_count + ' אירועים') + ' · ' + formatCurrency(p.total_amount)
    : 'עדיין לא שויך להוצאה';
  var idVal = isArtist ? p.artist_id : p.vendor_id;
  return '<div class="person-card ' + (isArtist ? 't-violet is-artist' : 't-sky') + '" role="button" tabindex="0" ' +
      'aria-label="' + escapeHtml(title) + ' — פתיחת הכרטיס" ' +
      'onclick="navigate(\'person\', {personKind: \'' + kind + '\', personId: \'' + idVal + '\'})">' +
    '<span class="person-avatar" aria-hidden="true">' + escapeHtml(initial) + '</span>' +
    '<span class="person-main">' +
      '<span class="person-name">' + escapeHtml(title) + '</span>' +
      (isArtist && p.real_name && p.real_name !== title ? '<span class="person-line">' + escapeHtml(p.real_name) + '</span>' : '') +
      (p.phone ? '<span class="person-line"><a class="person-phone num" href="tel:' + escapeHtml(p.phone) +
        '" onclick="event.stopPropagation();">' + escapeHtml(p.phone) + '</a></span>' : '') +
      '<span class="person-line">' + usage + '</span>' +
      (p.next_event_name
        ? '<span class="person-next">הקרוב: ' + escapeHtml(p.next_event_name) + ' · ' + formatDate(p.next_event_date) + '</span>'
        : '') +
      (isArtist && p.system_notes ? '<span class="person-note">' + escapeHtml(p.system_notes) + '</span>' : '') +
    '</span>' +
    '<button type="button" class="person-edit" aria-label="עריכת הפרטים של ' + escapeHtml(title) + '" ' +
      'onclick="event.stopPropagation(); ' + (isArtist ? 'openArtistEditSheet(' : 'openVendorEditSheet(') +
      JSON.stringify(p).replace(/"/g, '&quot;') + ')">' + ICON_EDIT + '</button>' +
  '</div>';
}

function peopleActionsHtml(kind) {

  return '<div class="btn-block-row" style="margin-top:20px;">' +
    '<button class="btn btn-secondary" onclick="' + (isArtist ? 'openArtistEditSheet(null)' : 'openVendorEditSheet(null)') + '">+ הוספת ' + (isArtist ? 'אמן' : 'ספק') + ' למערכת</button>' +
    '<button class="btn btn-secondary" onclick="openImportSheet(\'' + (isArtist ? 'artists' : 'vendors') + '\')">ייבוא רשימה</button></div>';
}

/** ממוין לפי מי שיש מולו יתרה פתוחה, ואחר כך לפי היקף העבודה */
function renderPeopleList() {
  var input = document.getElementById('people-search');
  var q = input ? input.value.trim().toLowerCase() : '';
  var kind = window.__peopleKind;
  var all = (window.__peopleList || []).slice();

  var nameOf = function (p) {
    return kind === 'artist' ? (p.display_name || p.stage_name || p.name || p.real_name || '') : p.name;
  };
  var filtered = all.filter(function (p) {
    if (!q) return true;
    return [nameOf(p), p.real_name, p.phone].filter(Boolean)
      .some(function (v) { return String(v).toLowerCase().indexOf(q) !== -1; });
  });
  filtered.sort(function (a, b) { return (Number(b.total_amount) || 0) - (Number(a.total_amount) || 0); });

  var count = document.getElementById('people-count');
  if (count) {
    count.textContent = filtered.length === 0 ? 'לא נמצאו התאמות'
      : filtered.length + (kind === 'artist'
          ? (filtered.length === 1 ? ' אמן' : ' אמנים')
          : (filtered.length === 1 ? ' ספק' : ' ספקים'));
  }
  var list = document.getElementById('people-list');
  if (!list) return;
  list.innerHTML = filtered.length
    ? filtered.map(function (p) { return personCardHtml(p, kind); }).join('')
    : emptyStateHtml('', 'לא נמצאו התאמות', null, '', true);
}

/**
 * מסך אדם — מערכת היחסים, לא כרטיס איש קשר.
 * בכמה אירועים עבדנו, סה"כ, ממוצע, מינימום/מקסימום, אירוע אחרון והבא,
 * וכל האירועים שבהם השתתף. כל הנתונים כבר קיימים בשרת.
 */
function renderPersonScreen(kind, id) {
  var isArtist = kind === 'artist';
  document.getElementById('screen-title').textContent = isArtist ? 'אמן' : 'ספק';
  renderLoading();

  var listPromise = isArtist ? refreshArtists() : refreshVendors();
  listPromise.then(function (list) {
    var idKey = isArtist ? 'artist_id' : 'vendor_id';
    var person = list.filter(function (x) { return x[idKey] === id; })[0];
    if (!person) { setScreen(emptyStateHtml('', 'הרשומה לא נמצאה', null, '')); return; }

    var title = isArtist ? (person.display_name || person.stage_name || person.name || person.real_name || '') : person.name;
    var html = '<header class="person-head">' +
      '<div class="person-head-top">' +
        '<span class="person-avatar lg" aria-hidden="true">' + escapeHtml(String(title || '?').trim().charAt(0)) + '</span>' +
        '<div class="person-head-main">' +
          '<h1 class="person-title">' + escapeHtml(title) + '</h1>' +
          (isArtist && person.real_name && person.real_name !== title
            ? '<div class="person-subtitle">' + escapeHtml(person.real_name) + '</div>' : '') +
          (person.events_count
            ? '<div class="person-badge">עבדנו יחד ' +
              (person.events_count === 1 ? 'פעם אחת' : person.events_count + ' פעמים') + '</div>'
            : '<div class="person-badge muted">עוד לא עבדנו יחד</div>') +
        '</div>' +
        '<button class="header-icon-btn" aria-label="עריכת הפרטים" onclick="' +
          (isArtist ? 'openArtistEditSheet(' : 'openVendorEditSheet(') +
          JSON.stringify(person).replace(/"/g, '&quot;') + ')">' + ICON_EDIT + '</button>' +
      '</div>' +
    '</header>';

    html += '<div id="person-stats">' + personStatsHtml(person, []) + '</div>';
    html += '<div id="person-history">' +
      panelHtml('sand', isArtist ? 'הופעות קודמות' : 'עבודות קודמות', '',
        '<div class="form-hint">טוען היסטוריה…</div>') + '</div>';

    if (person.phone || person.contact_details || person.notes) {
      var contact = '';
      if (person.phone) {
        contact += '<a class="contact-row" href="tel:' + escapeHtml(person.phone) + '">' +
          '<span class="contact-label">טלפון</span>' +
          '<span class="contact-value num">' + escapeHtml(person.phone) + '</span></a>';
      }
      if (person.contact_details) {
        contact += '<div class="contact-row"><span class="contact-label">פרטי קשר</span>' +
          '<span class="contact-value">' + escapeHtml(person.contact_details) + '</span></div>';
      }
      if (person.notes) {
        contact += '<div class="contact-row"><span class="contact-label">הערות</span>' +
          '<span class="contact-value">' + escapeHtml(person.notes) + '</span></div>';
      }
      html += collapsiblePanelHtml('sky', 'פרטי קשר והערות', '', contact);
    }

    if (isArtist) html += '<div id="artist-notes"></div>';

    setScreen(html);

    if (isArtist) {
      // getArtistExpenseHistory קיים בשרת מאז שלב 1 ולא היה בשימוש עד כאן
      callServer('getArtistExpenseHistory', id).then(function (history) {
        var stats = document.getElementById('person-stats');
        if (stats) stats.innerHTML = personStatsHtml(person, history);
        var box = document.getElementById('person-history');
        if (box) box.innerHTML = panelHtml('sand', 'הופעות קודמות',
          '<span class="panel-note">' + history.length + '</span>', personHistoryHtml(history, true));
      }).catch(function () {
        var box = document.getElementById('person-history');
        if (box) box.innerHTML = panelHtml('sand', 'הופעות קודמות', '',
          '<div class="form-hint">לא הצלחנו לטעון את ההיסטוריה.</div>');
      });
      reloadArtistNotes(id);
    } else {
      // searchExpenses כבר תומך בסינון לפי ספק — משם נבנית ההיסטוריה המלאה,
      // בלי endpoint חדש ובלי שינוי בשרת.
      callServer('searchExpenses', { vendor_id: id }).then(function (res) {
        var rows = (res && res.results) || [];   // searchExpenses מחזיר {results, summary}
        var stats = document.getElementById('person-stats');
        if (stats) stats.innerHTML = personStatsHtml(person, rows);

        var domains = {};
        rows.forEach(function (x) {
          var d = x.subcategory_name || x.category_name;
          if (d) domains[d] = (domains[d] || 0) + (Number(x.agreed_amount) || 0);
        });
        var domainHtml = Object.keys(domains).length
          ? '<div class="readiness-extra">תחומי הפקה: ' + escapeHtml(Object.keys(domains).join(' · ')) + '</div>'
          : '';

        var box = document.getElementById('person-history');
        if (box) {
          box.innerHTML = panelHtml('sand', 'עבודות קודמות',
            '<span class="panel-note">' + rows.length + '</span>',
            (rows.length ? personHistoryHtml(rows, false) : '<div class="form-hint">עוד לא שויכו לו הוצאות.</div>') + domainHtml);
        }
      }).catch(function () {
        var box = document.getElementById('person-history');
        if (box) box.innerHTML = panelHtml('sand', 'עבודות קודמות', '',
          '<div class="form-hint">לא הצלחנו לטעון את ההיסטוריה.</div>');
      });
    }
  }).catch(function (err) { renderError(err, function () { renderPersonScreen(kind, id); }); });
}

/** מערכת היחסים במספרים: סה"כ, ממוצע, מינימום ומקסימום */
function personStatsHtml(person, history) {
  var amounts = (history || []).map(function (h) { return Number(h.agreed_amount) || 0; })
    .filter(function (n) { return n > 0; });
  var total = Number(person.total_amount) || 0;
  var box = function (label, value) {
    return '<div class="stat-box"><span class="stat-label">' + label + '</span>' +
      '<div class="stat-value">' + value + '</div></div>';
  };
  var body = '<div class="summary-quad">' +
    box('אירועים', formatNumber(person.events_count || 0)) +
    box('סה"כ שסוכם', money(total)) +
    box('ממוצע לאירוע', amounts.length ? money(total / amounts.length) : '—') +
    box('טווח מחירים', amounts.length
      ? money(Math.min.apply(null, amounts)) + '–' + money(Math.max.apply(null, amounts))
      : '—') +
  '</div>';
  if (person.next_event_name) {
    body += '<button class="link-row" onclick="navigate(\'eventDetails\', {eventId: \'' + person.next_event_id + '\'})">' +
      '<span>הקרוב: ' + escapeHtml(person.next_event_name) + ' · ' + formatDate(person.next_event_date) + '</span>' + ICON_ARROW + '</button>';
  }
  return panelHtml('expenses', 'מערכת היחסים', '', body);
}

/** כל האירועים שבהם השתתף, עם סכום ושעות */
function personHistoryHtml(history, isArtist) {
  if (!history || !history.length) return '<div class="form-hint">אין עדיין היסטוריה.</div>';
  return history.map(function (h) {
    // timeRangeText מחזיר HTML (ספרות ב-LTR isolate) — ולכן לא עובר escape
    var meta = [escapeHtml(h.event_date ? formatDate(h.event_date) : '')];
    if (!isArtist && h.remaining_amount > 0) meta.push(money(h.remaining_amount) + ' נותר');
    if (isArtist && h.performance_start_time) {
      meta.push(timeRangeText(h.performance_start_time, h.performance_end_time));
      if (h.performance_duration_text) meta.push(escapeHtml(h.performance_duration_text));
      // עלות לשעה מחושבת מהנתונים שכבר חוזרים מ-getArtistExpenseHistory
      var mins = Number(h.performance_duration_minutes) || 0;
      var amount = Number(h.agreed_amount) || 0;
      if (mins > 0 && amount > 0) {
        meta.push(escapeHtml(formatCurrency(Math.round(amount / (mins / 60))) + ' לשעה'));
      }
    }
    return '<button type="button" class="history-row" ' +
        'aria-label="פתיחת האירוע ' + escapeHtml(h.event_name || '') + '" ' +
        'onclick="navigate(\'eventDetails\', {eventId: \'' + h.event_id + '\'})">' +
      '<div class="history-main">' +
        '<div class="history-name">' + escapeHtml(h.event_name || 'אירוע') + '</div>' +
        '<div class="history-meta">' + meta.filter(Boolean).join(' · ') + '</div>' +
      '</div>' +
      '<div class="history-amount">' + money(h.agreed_amount) + '</div>' +
    '</button>';
  }).join('');
}

function openArtistEditSheet(artist) {
  expenseSheetState.__artistNotesId = artist ? artist.artist_id : null;
  var body = '<form onsubmit="submitArtistForm(event' + (artist ? ", '" + artist.artist_id + "'" : ', null') + ')">' +
    '<div class="form-group"><label class="form-label" for="ar-stage">שם במה<span class="required">*</span></label>' +
      '<input class="form-input" id="ar-stage" name="stage_name" value="' + escapeHtml(artist ? (artist.stage_name || artist.name || '') : '') + '" placeholder="השם שמופיע בלוח האמנים"></div>' +
    '<div class="form-group"><label class="form-label" for="ar-real">שם אמיתי</label>' +
      '<input class="form-input" id="ar-real" name="real_name" value="' + escapeHtml(artist ? (artist.real_name || '') : '') + '" placeholder="לשימוש פנימי, לחוזים ולתשלומים"></div>' +
    '<div class="form-group"><label class="form-label" for="ar-phone">טלפון</label>' +
      '<input class="form-input" id="ar-phone" name="phone" type="tel" dir="ltr" placeholder="05X-XXXXXXX" value="' + escapeHtml(artist ? artist.phone : '') + '"></div>' +
    '<div class="form-group"><label class="form-label" for="ar-contact">פרטי קשר נוספים</label>' +
      '<input class="form-input" id="ar-contact" name="contact_details" value="' + escapeHtml(artist ? artist.contact_details : '') + '"></div>' +
    '<div class="form-group"><label class="form-label" for="ar-notes">הערות</label>' +
      '<textarea class="form-textarea" id="ar-notes" name="notes">' + escapeHtml(artist ? artist.notes : '') + '</textarea></div>' +
    '<div class="form-group"><label class="form-label" for="ar-system">הערות מערכת (קבועות)</label>' +
      '<textarea class="form-textarea" id="ar-system" name="system_notes" placeholder="העדפות, ניסיון קודם, דברים לזכור...">' + escapeHtml(artist ? artist.system_notes : '') + '</textarea>' +
      '<div class="form-hint">מוצג באירועים עתידיים — לא קשור להוצאה ספציפית.</div></div>' +
    '<button class="btn btn-gold" type="submit" id="artist-save-btn">שמור</button>' +
    (artist ? '<button type="button" class="btn btn-danger-ghost" style="margin-top:10px;" onclick="confirmArchiveArtist(\'' + artist.artist_id + '\')">ארכב אמן</button>' : '') +
    '</form>' +
    (artist ? '<div id="artist-notes"><div class="loading-wrap" style="padding-block:24px;"><div class="spinner"></div></div></div>' : '');
  openBottomSheet(artist ? 'עריכת אמן' : 'הוספת אמן למערכת', body,
    function () { expenseSheetState.__artistNotesId = null; });
  if (artist) reloadArtistNotes(artist.artist_id);
}

/** הערות מתוארכות של אמן — נטענות רק כשפותחים את הכרטיס שלו */
function reloadArtistNotes(artistId) {
  var box = document.getElementById('artist-notes');
  if (!box) return;
  callServer('getEntityNotes', 'artist', artistId).then(function (notes) {
    var el = document.getElementById('artist-notes');
    if (!el) return;
    el.innerHTML = '<div class="sub-title">הערות מתוארכות</div>' +
      (notes.length ? notes.map(function (n) { return noteRowHtml(n, 'artist', artistId); }).join('')
                    : '<div class="form-hint">אין עדיין הערות.</div>') +
      '<button type="button" class="btn btn-secondary btn-small" style="margin-top:10px;" onclick="openNoteSheet(\'artist\', \'' + artistId + '\', \'note\')">+ הוסף הערה</button>';
  }).catch(function () {
    var el = document.getElementById('artist-notes');
    if (el) el.innerHTML = '';
  });
}
function submitArtistForm(e, artistId) {
  e.preventDefault();
  var btn = document.getElementById('artist-save-btn');
  if (btn.disabled) return; btn.disabled = true; btn.textContent = 'שומר...';
  var form = e.target;
  var payload = {
    stage_name: form.stage_name.value, real_name: form.real_name.value,
    phone: form.phone.value, contact_details: form.contact_details.value,
    notes: form.notes.value, system_notes: form.system_notes.value
  };
  if (artistId) payload.artist_id = artistId;
  callServer('saveArtist', payload).then(function () {
    showToast('נשמר בהצלחה'); closeBottomSheet(); refreshCurrent();
  }).catch(function (err) { showToast(err, true); btn.disabled = false; btn.textContent = 'שמור'; });
}
function confirmArchiveArtist(id) {
  openConfirmDialog('לארכב את האמן?', 'ההיסטוריה של האמן תישמר.', function () {
    callServer('archiveArtist', id).then(function () {
      showToast('נשמר בהצלחה'); closeBottomSheet(); refreshCurrent();
    }).catch(function (err) { showToast(err, true); });
  });
}

/* ============================================================
   IMPORT LIST (אמנים / ספקים) — שם בכל שורה, כל רשומה מקבלת מזהה
   ============================================================ */
function openImportSheet(kind) {
  var isArtists = kind === 'artists';
  var body = '' +
    '<div class="form-group"><label class="form-label" for="import-text">' + (isArtists ? 'שמות אמנים' : 'שמות ספקים') + ' — שם אחד בכל שורה</label>' +
      '<textarea class="form-textarea" id="import-text" style="min-height:220px;" oninput="updateImportCount()" placeholder="אלעד ארזי&#10;סקוויד&#10;..."></textarea>' +
      '<div class="form-hint" id="import-count">0 שמות</div></div>' +
    '<div class="form-hint" style="margin-bottom:14px;">שמות שכבר קיימים במערכת ידולגו, כדי שלא ייווצרו כפילויות. טלפון ופרטים נוספים אפשר להוסיף אחר כך.</div>' +
    '<button class="btn btn-gold" id="import-btn" onclick="submitImport(\'' + kind + '\')">ייבוא</button>';
  openBottomSheet(isArtists ? 'ייבוא אמנים' : 'ייבוא ספקים', body);
}

function importLines() {
  return document.getElementById('import-text').value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
}
function updateImportCount() {
  document.getElementById('import-count').textContent = importLines().length + ' שמות';
}

function submitImport(kind) {
  var btn = document.getElementById('import-btn');
  if (btn.disabled) return;
  var lines = importLines();
  if (!lines.length) { showToast('יש להדביק לפחות שם אחד.', true); return; }
  btn.disabled = true; btn.textContent = 'מייבא...';
  callServer(kind === 'artists' ? 'importArtists' : 'importVendors', lines).then(function (res) {
    showToast('נוספו ' + res.created.length + (res.skipped.length ? ' · דולגו ' + res.skipped.length + ' שכבר קיימים' : ''));
    closeBottomSheet();
    refreshCurrent();
  }).catch(function (err) {
    showToast(err, true);
    btn.disabled = false; btn.textContent = 'ייבוא';
  });
}

/* ============================================================
   SETTINGS
   ============================================================ */
function renderSettings() {
  document.getElementById('screen-title').textContent = 'הגדרות';
  setScreen('<div style="margin-top:12px;">' + settingsRowsHtml() + '</div>' +
    '<div class="footnote" id="settings-footnote">DORON\'S RAVE · גרסה 1</div>' +
    '<div class="form-hint" style="text-align:center;">גישה לאפליקציה = שיתוף קובץ ה-Google Sheets כעורך.</div>');
  (appState.currentUser ? Promise.resolve({ email: appState.currentUser }) : callServer('getCurrentUser')).then(function (d) {
    appState.currentUser = d.email;
    var el = document.getElementById('settings-footnote');
    if (el && d.email) el.textContent = 'מחובר/ת כ-' + d.email + ' · DORON\'S RAVE';
  }).catch(function () {});
}

function openGoogleSheet() {
  callServer('getSpreadsheetUrl').then(function (data) {
    window.open(data.url, '_blank');
  }).catch(function (err) { showToast(err, true); });
}

/* ============================================================
   Bottom sheet / action sheet / confirm dialog (shared)
   ============================================================ */
function openBottomSheet(title, bodyHtml, onClose) {
  closeBottomSheet();
  var overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.id = 'active-sheet-overlay';
  overlay.onclick = function (e) { if (e.target === overlay) closeBottomSheet(); };
  overlay.innerHTML = '' +
    '<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="' + escapeHtml(title) + '">' +
      '<div class="sheet-handle"></div>' +
      '<div class="sheet-header"><div class="sheet-title">' + escapeHtml(title) + '</div>' +
        '<button class="sheet-close" onclick="closeBottomSheet()" aria-label="סגירה">' + ICON_CLOSE + '</button></div>' +
      '<div>' + bodyHtml + '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  window.__sheetOnClose = onClose || null;
}
function closeBottomSheet() {
  var el = document.getElementById('active-sheet-overlay');
  if (el) el.remove();
  var cb = window.__sheetOnClose;
  window.__sheetOnClose = null;
  if (el && cb) cb();
}

function openActionSheet(title, options) {
  var body = options.map(function (opt, i) {
    return '<button class="btn ' + (opt.danger ? 'btn-danger-ghost' : 'btn-secondary') + '" style="margin-bottom:10px;" onclick="handleActionSheetChoice(' + i + ')">' + escapeHtml(opt.label) + '</button>';
  }).join('');
  window.__actionSheetOptions = options;
  openBottomSheet(title, body);
}
function handleActionSheetChoice(i) {
  var opt = window.__actionSheetOptions[i];
  closeBottomSheet();
  if (opt && opt.action) opt.action();
}

function openConfirmDialog(title, message, onConfirm) {
  var body = '<div class="form-hint" style="font-size:var(--text-sm); margin-bottom:18px;">' + escapeHtml(message) + '</div>' +
    '<div class="btn-block-row">' +
      '<button class="btn btn-secondary" onclick="closeBottomSheet()">ביטול</button>' +
      '<button class="btn btn-danger-ghost" id="confirm-dialog-btn">אישור</button>' +
    '</div>';
  openBottomSheet(title, body);
  var btn = document.getElementById('confirm-dialog-btn');
  btn.onclick = function () {
    if (btn.disabled) return;
    btn.disabled = true;
    onConfirm();
  };
}

/* ============================================================
   Init
   ============================================================ */
document.addEventListener('DOMContentLoaded', function () {
  navigate('home');
});
</script>
