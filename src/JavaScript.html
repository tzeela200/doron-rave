   ============================================================ */
/**
 * תיק האירוע — מרכז העבודה.
 *
 * חמש קבוצות עבודה, בסדר שמפיק חושב בו:
 *   1. מצב האירוע   — מתי, מה מוכן, מה דחוף, מה הפעולה הבאה   (פתוח תמיד)
 *   2. הפקה         — תחומי ההפקה, קטגוריות, תתי-קטגוריות, כיסוי
 *   3. אנשים        — אמנים, ליינאפ, ספקים, אנשי קשר
 *   4. כספים        — מתוכנן/מוסכם/שולם/נותר, תשלומים, הכנסות, P&L, חלוקה
 *   5. תיעוד        — הערות ותזכורות
 *
 * כל יכולת ונתון שהיו כאן קודם נשארו. מה שהשתנה: ההיררכיה.
 */
function renderEventDetails(eventId) {
  document.getElementById('screen-title').textContent = '';
  renderLoading();
  callServer('getEventDetails', eventId).then(function (data) {
    var ev = data.event;
    var t = data.totals;
    appState.cache.paymentMethods = data.paymentMethods || appState.cache.paymentMethods;
    window.__currentEventData = data;
    window.__currentEventExpenses = data.expenses;
    window.__currentEventIncome = data.income;
    window.__readinessEventId = ev.event_id;

    var readiness = data.readiness || [];
    var active = readiness.filter(function (r) { return r.status !== 'skipped'; });
    var missing = active.filter(function (r) { return r.status === 'missing'; }).length;
    var inProgress = active.filter(function (r) { return r.status === 'in_progress'; }).length;
    var done = active.length - missing - inProgress;

    var html = '';

    /* ---------- 1. מצב האירוע: בלוק צבעוני, חישובים, ואז פעולות ---------- */
    html += eventHeroHtml(ev, t, { total: active.length, done: done, inProgress: inProgress, missing: missing });
    html += eventStatTilesHtml(t, data.pnl);
    html += eventQuickActionsHtml(ev.event_id);

    // חפיפת שעות בין אמנים היא סתירה אמיתית בנתונים שהמשתמשת הזינה, ולכן נשארת.
    // שאר הפריטים ש-buildAttentionItems_ מסיק לבד (payment/readiness) לא מוצגים.
    var overlaps = overlapAlertsFromLineup(data.artistLineup, ev.event_id, ev.name);
    html += myRemindersHtml(data.attention, overlaps, ev.event_id);

    /* ---------- 2. הפקה ---------- */
    html += groupHeadingHtml('הפקה', 'מה צריך לסגור כדי שהאירוע יקרה');

    html += collapsiblePanelHtml('sky', 'מצב ההפקה',
      active.length ? done + ' מתוך ' + active.length + ' סגורים' : 'לא הוגדר',
      readinessBodyHtml(readiness, data.coverage || []), 'readiness');

    html += collapsiblePanelHtml('expenses', 'הוצאות לפי תחום', money(t.total_expenses),
      expensesByDomainHtml(data.expenses, ev.event_id), 'expenses');

    /* ---------- 3. אנשים ---------- */
    html += groupHeadingHtml('אנשים', 'מי מבצע את האירוע ומה פתוח מולו');

    var lineup = data.artistLineup || [];
    html += collapsiblePanelHtml('violet', 'אמנים וליינאפ',
      lineup.length ? (lineup.length === 1 ? 'אמן אחד' : lineup.length + ' אמנים') : '',
      lineupBodyHtml(lineup, ev.event_id, data.expenses), 'lineup');

    html += collapsiblePanelHtml('sky', 'ספקים ואנשי קשר',
      peopleCountText_(data.expenses), peoplePanelBodyHtml(data.expenses), 'people');

    /* ---------- 4. כספים ---------- */
    html += groupHeadingHtml('כספים', 'מה התחייבנו, מה שולם ומה הסיכון');

    var plannedTotal = data.pnl ? data.pnl.planned_expenses : t.total_expenses;
    html += collapsiblePanelHtml('sand', 'סיכום כספי', money(t.balance),
      summaryQuadHtml(plannedTotal, t.total_expenses, t.total_paid, t.total_remaining) +
      '<div class="summary-secondary">הכנסות <b>' + formatCurrency(t.total_income) + '</b>' +
        ' · מאזן <b class="' + balanceClass(t.balance) + '">' + formatCurrency(t.balance) + '</b></div>', 'summary');

    html += collapsiblePanelHtml('payments', 'תשלומים ומקדמות', money(t.total_remaining) + ' נותר',
      paymentsOverviewHtml(data.expenses), 'payments');

    html += collapsiblePanelHtml('income', 'הכנסות', money(t.total_income),
      (data.income.length
        ? data.income.map(incomeItemHtml).join('')
        : emptyStateHtml('', 'אין עדיין הכנסות', null, '', true)) +
      '<button class="btn btn-secondary btn-small" style="margin-top:8px;" onclick="openIncomeSheet(\'' + ev.event_id + '\')">+ הוסף שורת הכנסה</button>', 'income');

    html += collapsiblePanelHtml('sky', 'כרטיסים ונקודת איזון',
      (data.pnl && data.pnl.break_even_remaining > 0 ? formatNumber(data.pnl.break_even_remaining) + ' כרטיסים חסרים' : ''),
      pnlBodyHtml(data.pnl, t), 'tickets');

    html += collapsiblePanelHtml('expenses', 'חלוקת הוצאות', '', breakdownBodyHtml(data, t), 'breakdown');

    /* ---------- 5. תיעוד ---------- */
    html += groupHeadingHtml('תיעוד', 'הערות, תזכורות והקשר');

    var openNotes = (data.notes || []).filter(function (n) { return n.note_type === 'reminder' && !n.is_completed; }).length;
    html += collapsiblePanelHtml('violet', 'הערות ותזכורות',
      openNotes ? openNotes + ' תזכורות פתוחות' : '',
      notesBodyHtml(data.notes || [], 'event', ev.event_id), 'notes');

    setScreen(html);
  }).catch(function (err) { renderError(err, function () { renderEventDetails(eventId); }); });
}

/** כותרת קבוצת עבודה — מפרידה בין חמשת העולמות של האירוע */
function groupHeadingHtml(title, hint) {
  return '<div class="group-heading">' +
    '<h2 class="group-title">' + escapeHtml(title) + '</h2>' +
    '<span class="group-hint">' + escapeHtml(hint) + '</span>' +
  '</div>';
}

/**
 * בלוק הגיבור של האירוע.
 *
 * מהות: המסך נפתח באירוע עצמו — כמה זמן נשאר וכמה ממנו סגור.
 * מבנה: כרטיס צבוע בגוון הדחיפות, כתב לבן, טבעת מוכנות וספירה לאחור.
 * פעולה: תפריט הפעולות של האירוע יושב בפינה, כמו שהיה.
 *
 * הגוון נגזר מהמרחק לאירוע, ולכן הצבע מוסיף מידע ולא רק קישוט:
 * כתום = השבוע · כחול = עתידי · חול = כבר היה.
 */
function eventHeroHtml(ev, t, r) {
  var days = daysUntil(ev.event_date);
  var isPast = days !== null && days < 0;
  var tint = isPast ? 't-sand' : (days !== null && days <= 7 ? 't-ember' : 't-sky');

  var value, label;
  if (days === null) { value = '—'; label = 'אין תאריך לאירוע'; }
  else if (days > 0) { value = formatNumber(days); label = days === 1 ? 'יום לאירוע' : 'ימים לאירוע'; }
  else if (days === 0) { value = 'היום'; label = 'האירוע מתקיים היום'; }
  else { value = formatNumber(-days); label = (days === -1 ? 'יום' : 'ימים') + ' מאז האירוע'; }

  // אחוז המוכנות אמיתי — נגזר משלבי ההפקה. על אירוע שעבר אין לאן להיערך.
  var pct = r.total ? Math.round((r.done / r.total) * 100) : 0;
  var ring = (!isPast && r.total)
    ? '<div class="ring" style="--p:' + pct + ';--ring-color:' + (r.missing ? 'var(--ember)' : 'var(--sage)') + ';" ' +
        'role="img" aria-label="' + pct + ' אחוז מוכן, ' + r.done + ' מתוך ' + r.total + ' תחומים סגורים">' +
        '<span class="ring-text"><span class="ring-pct">' + pct + '%</span><span class="ring-word">מוכן</span></span>' +
      '</div>'
    : '';

  var note = r.total
    ? (isPast ? r.done + ' מתוך ' + r.total + ' תחומים נסגרו' : r.done + ' מתוך ' + r.total + ' תחומים סגורים')
    : '';

  return '<header class="event-hero ' + tint + '">' +
      '<div class="event-head-top">' +
        '<div class="event-head-main">' +
          '<h1 class="event-title">' + escapeHtml(ev.name) + '</h1>' +
          '<div class="event-subtitle">' + eventMetaText(ev) + '</div>' +
        '</div>' +
        '<button class="header-icon-btn" onclick="openEventActionsMenu(\'' + ev.event_id + '\')" aria-label="פעולות אירוע: עריכה, שכפול, ארכוב">' + ICON_MORE + '</button>' +
      '</div>' +
      (ev.general_notes ? '<div class="detail-notes">' + escapeHtml(ev.general_notes) + '</div>' : '') +
      '<div class="hero-gauge">' + ring +
        '<div class="hero-days">' +
          '<div class="hero-days-value">' + value + '</div>' +
          '<div class="hero-days-label">' + label + '</div>' +
          (note ? '<div class="hero-days-note">' + note + '</div>' : '') +
        '</div>' +
      '</div>' +
      eventStatusStripHtml(ev, t, r.total, r.done, r.inProgress, r.missing) +
    '</header>';
}

/**
 * החישובים של האירוע, למעלה, כארבעה אריחים צבעוניים בכתב לבן.
 *
 * כל אריח נושא שני מספרים: הראשי, ומתחתיו ההקשר שהופך אותו למובן —
 * כך שמונה נתונים כספיים נקראים בלי לפתוח אף בלוק ובלי לגלול.
 * לחיצה פותחת את הבלוק שממנו המספר מגיע.
 */
function eventStatTilesHtml(t, pnl) {
  var tile = function (tint, label, value, note, section, aria) {
    return '<button type="button" class="stat-tile ' + tint + '" onclick="openEventSection(\'' + section + '\')" ' +
        'aria-label="' + escapeHtml(aria) + '">' +
      '<span class="stat-tile-value">' + value + '</span>' +
      '<span class="stat-tile-label">' + escapeHtml(label) + '</span>' +
      (note ? '<span class="stat-tile-note">' + note + '</span>' : '') +
    '</button>';
  };

  var planned = pnl ? pnl.planned_expenses : null;
  var balanceLabel = t.balance < 0 ? 'חסר לכיסוי' : 'מאזן';
  var forecast = (pnl && pnl.forecast_profit !== null && pnl.forecast_profit !== undefined)
    ? (pnl.forecast_profit < 0 ? 'הפסד צפוי ' : 'רווח צפוי ') + formatCurrency(Math.abs(pnl.forecast_profit))
    : '';
  var tickets = (pnl && pnl.tickets_sold > 0) ? formatNumber(pnl.tickets_sold) + ' כרטיסים' : '';

  return '<div class="stat-tiles">' +
    tile('t-clay', 'הוצאות', money(t.total_expenses),
      (planned !== null && planned !== t.total_expenses) ? 'מתוכנן ' + formatCurrency(planned) : 'סכום שסוכם',
      'expenses', 'סך ההוצאות — פתיחת ההוצאות לפי תחום') +
    tile(t.total_remaining > 0 ? 't-ember' : 't-sage', 'נותר לתשלום', money(t.total_remaining),
      'שולם ' + formatCurrency(t.total_paid),
      'payments', 'נותר לתשלום — פתיחת התשלומים') +
    tile('t-sage', 'הכנסות', money(t.total_income), tickets,
      'income', 'סך ההכנסות — פתיחת ההכנסות') +
    tile(t.balance < 0 ? 't-clay' : 't-sky', balanceLabel, money(Math.abs(t.balance)), forecast,
      'summary', balanceLabel + ' — פתיחת הסיכום הכספי') +
  '</div>';
}

/** כמה אנשים מעורבים — סיכום שנשאר גלוי גם כשהבלוק סגור */
function peopleCountText_(expenses) {
  var seen = {};
  (expenses || []).forEach(function (ex) {
    if (!ex.artist_id && ex.vendor_name) seen[ex.vendor_name] = true;
  });
  var n = Object.keys(seen).length;
  return n ? (n === 1 ? 'ספק אחד' : n + ' ספקים') : '';
}

/**
 * שורת מצב האירוע: כמה זמן נשאר, מה מוכן, ומה החריגה — בלי להתחיל במספר כספי.
 */
function eventStatusStripHtml(ev, t, total, done, inProgress, missing) {
  // הספירה לאחור עברה לטבעת בבלוק הגיבור; כאן נשארו החריגות בלבד.
  var chips = [];
  if (missing) {
    chips.push('<span class="state-chip bad">' +
      (missing === 1 ? 'תחום אחד חסר' : missing + ' תחומים חסרים') + '</span>');
  }
  if (inProgress) chips.push('<span class="state-chip">' + inProgress + ' בתהליך</span>');
  if (total && !missing && !inProgress) chips.push('<span class="state-chip good">הכל סגור</span>');

  return chips.length ? '<div class="state-chips">' + chips.join('') + '</div>' : '';
}

/**
 * מצב ההפקה — הרשימה הקבועה של תחומי ההפקה.
 * "לא צריך" נאסף בנפרד, כי מה שלא צריך אינו חסר.
 * רכיבים שקיימים בפועל ואינם ברשימה הקבועה מוצגים כדי שלא ייעלמו.
 */
/**
 * מצב ההפקה — מה שהמשתמשת סימנה שהאירוע צריך, ומה כבר סגור מולו.
 *
 * אירוע שטרם הוגדר **לא מציג אחוז ולא מציג "0 מתוך 0"**. הוא מזמין להגדיר,
 * כי מספר מוכנות בלי רשימה שהמשתמשת בחרה הוא מספר מומצא.
 */
function readinessBodyHtml(list, coverage) {
  var editBtn = '<button class="btn btn-secondary btn-small" style="margin-top:10px;" ' +
    'onclick="openRequirementsPicker()">מה האירוע הזה צריך?</button>';

  if (!list.length) {
    return '<div class="readiness-setup">' +
        '<div class="readiness-setup-title">עוד לא הגדרת מה האירוע הזה צריך</div>' +
        '<div class="readiness-setup-text">בחרי מתוך הקטגוריות שלך, ואז נדע באמת מה סגור ומה לא.</div>' +
      '</div>' + editBtn;
  }

  // חסר קודם — זה מה שמסכן את האירוע
  var order = { missing: 0, in_progress: 1, covered: 2, included: 3 };
  var rows = list.slice().sort(function (a, b) { return order[a.status] - order[b.status]; });
  var body = rows.map(readinessRowHtml).join('');

  // רכיבים שיש להם הוצאה אבל לא סומנו כנדרשים — לא חוסר, רק הקשר
  var known = {};
  list.forEach(function (r) { known[r.key] = true; });
  var extras = (coverage || [])
    .filter(function (c) { return !known[c.key] && c.status !== 'in_progress'; })
    .map(function (c) { return c.name; });
  if (extras.length) {
    body += '<div class="readiness-extra">סגור גם (לא סומן כנדרש): ' + escapeHtml(extras.join(' · ')) + '</div>';
  }
  return body + editBtn;
}

/**
 * מסך הבחירה: הקטגוריות שלה, מקובצות, והיא מסמנת מה האירוע צריך.
 * כלום לא מסומן מראש — ההיגיון הפוך מהרשימה הקבועה שהייתה כאן קודם.
 */
function openRequirementsPicker() {
  var eventId = window.__readinessEventId;
  var current = {};
  ((window.__currentEventData && window.__currentEventData.readiness) || [])
    .forEach(function (r) { current[r.key] = true; });
  window.__pickedRequirements = current;

  ensureLookups().then(function () {
    var cats = appState.cache.categories || [];
    var body = cats.map(function (c) {
      var subs = (c.subcategories || []).filter(function (x) { return !x.is_archived; });
      // קטגוריה בלי תתי-קטגוריות (כמו "אמנים") נבחרת בעצמה
      var items = subs.length
        ? subs.map(function (sc) { return requirementCheckHtml_('sub:' + sc.subcategory_id, sc.name); }).join('')
        : requirementCheckHtml_('cat:' + c.category_id, c.name);
      return '<div class="req-group">' +
          '<div class="req-group-title">' + escapeHtml(c.name) + '</div>' + items +
        '</div>';
    }).join('');

    openBottomSheet('מה האירוע הזה צריך?',
      '<div class="form-hint" style="margin-bottom:12px;">סמני כל מה שצריך לקרות באירוע. מה שלא תסמני לא ייחשב חסר.</div>' +
      body +
      '<div class="sheet-actions">' +
        '<button class="btn btn-primary" onclick="saveRequirementsPicker(\'' + eventId + '\')">שמור</button>' +
      '</div>');
  }).catch(function (err) { showToast(err, true); });
}

function requirementCheckHtml_(key, label) {
  var on = !!window.__pickedRequirements[key];
  return '<label class="check-row">' +
    '<input type="checkbox" class="cmp-check"' + (on ? ' checked' : '') +
      ' onchange="window.__pickedRequirements[\'' + key + '\'] = this.checked;">' +
    '<span class="cr-main">' + escapeHtml(label) + '</span></label>';
}

function saveRequirementsPicker(eventId) {
  var keys = Object.keys(window.__pickedRequirements || {})
    .filter(function (k) { return window.__pickedRequirements[k]; });
  callServer('setEventRequiredItems', eventId, keys).then(function () {
    showToast('נשמר בהצלחה');
    closeBottomSheet();
    refreshCurrent();
  }).catch(function (err) { showToast(err, true); });
}

function readinessRowHtml(r) {
  var mark = { covered: '✓', included: '✓', in_progress: '•', missing: '⚠' }[r.status];
  var note = {
    covered: r.source_name,
    included: r.source_name ? 'כלול ב' + r.source_name : 'כלול בעסקה אחרת',
    in_progress: 'יש הוצאה מתוכננת, עוד לא סוכם',
    missing: 'אין לזה עדיין כיסוי'
  }[r.status];
  var needed = true;   // כל שורה כאן היא רכיב שהמשתמשת סימנה כנדרש
  var statusWord = { covered: 'סגור', included: 'כלול', in_progress: 'בתהליך', missing: 'חסר' }[r.status];
  return '<div class="readiness-row ' + r.status + '">' +
      '<span class="readiness-mark" aria-hidden="true">' + mark + '</span>' +
      '<div class="readiness-text">' +
        '<div class="readiness-label">' + escapeHtml(r.label) +
          '<span class="sr-only"> — ' + statusWord + '</span></div>' +
        '<div class="readiness-note">' + escapeHtml(note || '') + '</div>' +
      '</div>' +
      (r.source_expense_id
        ? '<button type="button" class="btn-ghost readiness-open" aria-label="פתיחת ההוצאה של ' + escapeHtml(r.label) + '" ' +
          'onclick="openExpenseSheet(\'' + window.__readinessEventId + '\', \'' + r.source_expense_id + '\')">פתח</button>'
        : '<button type="button" class="btn-ghost readiness-open" aria-label="הוספת הוצאה לתחום ' + escapeHtml(r.label) + '" ' +
          'onclick="openExpenseSheet(\'' + window.__readinessEventId + '\')">+ הוצאה</button>') +
      '<button type="button" class="btn-ghost readiness-skip" ' +
        'aria-label="הסרת ' + escapeHtml(r.label) + ' מרשימת מה שהאירוע צריך" ' +
        'onclick="toggleRequirement(\'' + r.key + '\', false)">לא צריך</button>' +
    '</div>';
}

function toggleSkippedReadiness(btn) {
  var box = btn.nextElementSibling;
  box.hidden = !box.hidden;
  btn.setAttribute('aria-expanded', String(!box.hidden));
}

function toggleRequirement(key, needed) {
  callServer('setEventRequirement', window.__readinessEventId, key, needed)
    .then(function () { refreshCurrent(); })
    .catch(function (err) { showToast(err, true); });
}

/**
 * ההוצאות מקובצות לפי הקטגוריה ותת-הקטגוריה שלהן — כך שהקטגוריות
 * מתפקדות כלוח ההפקה ולא כטבלת הנהלת חשבונות.
 * כל הוצאה מוצגת פעם אחת, תחת השיוך האמיתי שלה.
 */
function expensesByDomainHtml(expenses, eventId) {
  var addBtn = '<button class="btn btn-secondary btn-small" style="margin-top:10px;" ' +
    'onclick="openExpenseSheet(\'' + eventId + '\')">+ הוסף הוצאה</button>';
  if (!expenses || !expenses.length) {
    return emptyStateHtml('', 'אין עדיין הוצאות באירוע הזה', null, '', true) + addBtn;
  }

  var groups = {}, order = [];
  expenses.forEach(function (ex) {
    var cat = ex.category_name || 'לא מסווג';
    if (!groups[cat]) { groups[cat] = { name: cat, total: 0, items: [] }; order.push(cat); }
    groups[cat].total += Number(ex.agreed_amount) || 0;
    groups[cat].items.push(ex);
  });
  order.sort(function (a, b) { return groups[b].total - groups[a].total; });

  return order.map(function (cat) {
    var g = groups[cat];
    var subs = {};
    g.items.forEach(function (ex) {
      var sub = ex.subcategory_name || '';
      (subs[sub] = subs[sub] || []).push(ex);
    });
    var body = Object.keys(subs).map(function (sub) {
      return (sub ? '<div class="domain-sub">' + escapeHtml(sub) + '</div>' : '') +
        subs[sub].map(expenseItemHtml).join('');
    }).join('');

    return '<div class="domain-block">' +
      '<div class="domain-head">' +
        '<span class="domain-name">' + escapeHtml(g.name) + '</span>' +
        '<span class="domain-count">' + (g.items.length === 1 ? 'התחייבות אחת' : g.items.length + ' התחייבויות') + '</span>' +
        '<span class="domain-total">' + money(g.total) + '</span>' +
      '</div>' + body +
    '</div>';
  }).join('') + addBtn;
}

/** ליינאפ: לוח האמנים הקיים, עם פעולת הוספה בהקשר */
/**
 * "אמנים וליין אפ" — כל האמנים של האירוע, לא רק המשובצים.
 *
 * `artistLineup` מהשרת כולל רק אמנים שהוזנו להם שעות. אמן בלי שעות היה
 * נופל מכאן, וקודם הוא "נתפס" בטעות ב"ספקים ואנשי קשר". מאחר שהוא הוסר
 * משם (אמן אינו ספק), הבלוק הזה חייב להציג את כולם.
 *
 * @param {Object[]} lineup - data.artistLineup (משובצים, לפי רצף לילה)
 * @param {string} eventId
 * @param {Object[]} expenses - כל הוצאות האירוע, לאיתור אמנים בלי שעות
 */
function lineupBodyHtml(lineup, eventId, expenses) {
  var addBtn = '<button class="btn btn-secondary btn-small" style="margin-top:10px;" ' +
    'onclick="openExpenseSheet(\'' + eventId + '\', null, \'artist\')">+ הוספת אמן לאירוע</button>';

  var scheduled = {};
  (lineup || []).forEach(function (s) { scheduled[s.expense_id] = true; });
  var unscheduled = (expenses || []).filter(function (ex) {
    return ex.artist_id && !scheduled[ex.expense_id];
  });

  if (!lineup.length && !unscheduled.length) {
    return emptyStateHtml('', 'עוד לא שובצו אמנים', null, '', true) + addBtn;
  }

  var body = artistLineupBodyHtml(lineup);
  if (unscheduled.length) {
    body += '<div class="lineup-unscheduled">' +
      '<div class="lineup-unscheduled-title">' +
        (unscheduled.length === 1 ? 'אמן אחד בלי שעות' : unscheduled.length + ' אמנים בלי שעות') +
      '</div>' +
      unscheduled.map(function (ex) {
        return '<div class="lineup-row is-unscheduled" role="button" tabindex="0" ' +
            'onclick="openExpenseSheet(\'' + eventId + '\', \'' + ex.expense_id + '\')">' +
          '<span class="lineup-time">—</span>' +
          '<span class="lineup-main"><span class="lineup-name">' +
            escapeHtml(ex.artist_name || ex.name) + '</span></span>' +
          '<span class="lineup-duration">' + money(ex.agreed_amount) + '</span>' +
        '</div>';
      }).join('') +
    '</div>';
  }
  return body + addBtn;
}

/** חלוקת הוצאות — לפי קטגוריה או לפי ספק, כמו קודם */
function breakdownBodyHtml(data, t) {
  if (!(t.total_expenses > 0)) return emptyStateHtml('', 'אין עדיין מה לחלק', null, '', true);
  window.__breakdown = {
    byCategory: data.expensesByCategory,
    bySubcategory: data.expensesBySubcategory || {},
    byVendor: data.expensesByVendor,
    total: t.total_expenses
  };
  return '<div class="segmented" id="breakdown-toggle" style="margin-block:4px 10px;">' +
      '<button type="button" class="active" data-kind="category" onclick="switchBreakdown(this)">לפי קטגוריה</button>' +
      '<button type="button" data-kind="vendor" onclick="switchBreakdown(this)">לפי ספק</button>' +
    '</div><div id="breakdown-body">' + breakdownRowsHtml('category') + '</div>';
}

/** תשלומים של כל האירוע במקום אחד, בלי להיכנס להוצאה */
function paymentsOverviewHtml(expenses) {
  var rows = [];
  (expenses || []).forEach(function (ex) {
    (ex.payments || []).forEach(function (p) { rows.push({ p: p, ex: ex }); });
  });
  if (!rows.length) return emptyStateHtml('', 'אין תשלומים מתוכננים', null, '', true);
  rows.sort(function (a, b) { return String(a.p.due_date || '9999').localeCompare(String(b.p.due_date || '9999')); });
  return rows.map(function (r) {
    var sub = [r.ex.artist_name || r.ex.vendor_name, r.p.method_name].filter(Boolean).map(escapeHtml).join(' · ');
    return '<div class="payment-line" role="button" tabindex="0" ' +
        'onclick="openExpenseSheet(\'' + r.ex.event_id + '\', \'' + r.ex.expense_id + '\')">' +
      '<div class="pl-main">' + escapeHtml(r.ex.name) + ' ' + statusChipHtml(r.p.display_status) +
        '<div class="pl-sub">' + (r.p.due_date ? formatDate(r.p.due_date) : 'ללא מועד') + (sub ? ' · ' + sub : '') + '</div>' +
      '</div>' +
      '<div class="pl-amount">' + money(r.p.amount) + '</div>' +
    '</div>';
  }).join('');
}

/** מי מעורב באירוע — נגזר מההוצאות, בלי לאחד טבלאות */
/**
 * ספקים בלבד. אמן אינו ספק, ויש לו בלוק משלו — קודם הוא הופיע בשניהם.
 */
function peoplePanelBodyHtml(expenses) {
  var people = {};
  (expenses || []).forEach(function (ex) {
    if (ex.artist_id) return;
    var name = ex.vendor_name;
    if (!name) return;
    var key = 'v:' + name;
    var entry = people[key] || (people[key] = {
      name: name, kind: 'ספק',
      total: 0, paid: 0, items: []
    });
    entry.total += Number(ex.agreed_amount) || 0;
    entry.paid += Number(ex.paid_amount) || 0;
    entry.items.push(ex.name);
  });
  var list = Object.keys(people).map(function (k) { return people[k]; });
  if (!list.length) return emptyStateHtml('', 'עוד לא שויכו ספקים או אמנים', null, '', true);
  list.sort(function (a, b) { return b.total - a.total; });
  return list.map(function (x) {
    var remaining = x.total - x.paid;
    return '<div class="people-row">' +
      '<div class="people-main">' +
        '<div class="people-name">' + escapeHtml(x.name) + '<span class="people-kind">' + x.kind + '</span></div>' +
        '<div class="people-items">' + escapeHtml(x.items.join(' · ')) + '</div>' +
      '</div>' +
      '<div class="people-side">' +
        '<div class="people-total">' + money(x.total) + '</div>' +
        (remaining > 0 ? '<div class="people-remaining">' + money(remaining) + ' נותר</div>' : '<div class="people-paid">שולם</div>') +
      '</div>' +
    '</div>';
  }).join('');
}

/**
 * פעולות מהירות בתוך אירוע — אריחים צבעוניים עם אייקון וכתב לבן,
 * באותה שפה של אריחי הבית. הצבע מזהה את סוג הרישום.
 */
function eventQuickActionsHtml(eventId) {
  var actions = [
    { label: 'הוצאה', tint: 't-clay', icon: ICON_FOLDER, onclick: "openExpenseSheet('" + eventId + "')" },
    { label: 'הכנסה', tint: 't-sage', icon: ICON_COIN, onclick: "openIncomeSheet('" + eventId + "')" },
    { label: 'תזכורת', tint: 't-ember', icon: ICON_NOTE, onclick: "openNoteSheet('event', '" + eventId + "', 'reminder')" }
  ];
  return '<div class="act-tiles">' + actions.map(function (a) {
    return '<button type="button" class="act-tile ' + a.tint + '" onclick="' + a.onclick + '" ' +
      'aria-label="הוספת ' + escapeHtml(a.label) + '">' +
      a.icon + '<span>' + escapeHtml(a.label) + '</span></button>';
  }).join('') + '</div>';
}

/* ============================================================
   תמונה פיננסית (P&L) — נשען על computeEventPnl_ מהשרת
   ============================================================ */
function pnlBodyHtml(pnl, totals) {
  if (!pnl) return '';
  var rows = '<div class="stat-row cols-2">' +
      '<div class="stat-box"><span class="stat-label">הוצאות מתוכננות</span><div class="stat-value">' + money(pnl.planned_expenses) + '</div></div>' +
      '<div class="stat-box"><span class="stat-label">כרטיסים שנמכרו</span><div class="stat-value"><span class="num">' + formatNumber(pnl.tickets_sold) + '</span></div></div>' +
    '</div>';

  var tiers = pnl.ticket_tiers || [];
  var tiersHtml = '<div class="tiers-block">' +
    '<div class="tiers-head">' +
      '<span class="tiers-title">סבבי תמחור</span>' +
      '<button type="button" class="btn-ghost" onclick="openTicketTiersSheet()">' +
        (tiers.length ? 'עריכה' : '+ הוספת סבב') + '</button>' +
    '</div>' +
    (tiers.length
      ? tiers.map(function (t) {
          return '<div class="tier-row">' +
            '<span class="tier-name">' + escapeHtml(t.name) + '</span>' +
            '<span class="tier-qty"><span class="num">' + formatNumber(t.quantity) + '</span> כרטיסים</span>' +
            '<span class="tier-price">' + money(t.price) + '</span>' +
          '</div>';
        }).join('') +
        '<div class="tier-total">סה"כ ' +
          '<span class="num">' + formatNumber(tiers.reduce(function (n, t) { return n + t.quantity; }, 0)) + '</span>' +
          ' כרטיסים · ' + money(tiers.reduce(function (n, t) { return n + t.quantity * t.price; }, 0)) + '</div>'
      : '<div class="pnl-note">מחיר אחד לכל הכרטיסים. אפשר להגדיר סבבים — מוקדם, מאחרים, VIP — וכל סבב במחיר משלו.</div>') +
  '</div>';

  var breakEven;
  if (pnl.break_even_unreachable) {
    breakEven = '<div class="pnl-note warn">כל סבבי התמחור יחד לא מכסים את ההוצאות המתוכננות. ' +
      'צריך עוד כרטיסים, מחיר גבוה יותר, או הוצאה נמוכה יותר.</div>';
  } else if (pnl.break_even_tickets === null) {
    breakEven = '<div class="pnl-note">כדי לחשב נקודת איזון צריך מחיר כרטיס — או סבב תמחור אחד לפחות.</div>';
  } else {
    var pct = pnl.break_even_tickets > 0 ? Math.min(100, Math.round(pnl.tickets_sold / pnl.break_even_tickets * 100)) : 100;
    breakEven = '<div class="pnl-break-even">' +
      '<div class="pnl-be-top"><span>נקודת איזון</span>' +
        '<b><span class="num">' + formatNumber(pnl.tickets_sold) + ' / ' + formatNumber(pnl.break_even_tickets) + '</span> כרטיסים</b></div>' +
      '<div class="progress-track"><i style="width:' + pct + '%"></i></div>' +
      '<div class="pnl-note">' + (pnl.break_even_remaining > 0
        ? 'חסרים עוד ' + formatNumber(pnl.break_even_remaining) + ' כרטיסים כדי לכסות את ההוצאות המתוכננות'
        : 'ההוצאות המתוכננות מכוסות') + '</div>' +
    '</div>';
  }

  var forecast = pnl.forecast_profit === null
    ? '<div class="pnl-note">לתחזית רווח צריך סבבי תמחור, או כמות כרטיסים צפויה ומחיר כרטיס ממוצע.</div>'
    : '<div class="stat-row cols-2">' +
        '<div class="stat-box"><span class="stat-label">הכנסה צפויה מכרטיסים</span><div class="stat-value">' + money(pnl.forecast_ticket_income) + '</div></div>' +
        '<div class="stat-box"><span class="stat-label">תחזית רווח</span><div class="stat-value ' + balanceClass(pnl.forecast_profit) + '">' + money(pnl.forecast_profit) + '</div></div>' +
      '</div>';

  return rows + tiersHtml + breakEven + '<div class="pnl-sub-label">תחזית</div>' + forecast;
}

/* ============================================================
   סבבי תמחור — "סבב ראשון", "מאחרים", "VIP"
   הסדר הוא סדר המכירה, ולכן נקודת האיזון מחושבת לפיו:
   קודם הסבב הראשון, ורק כשהוא נגמר עוברים לבא.
   ============================================================ */
function openTicketTiersSheet() {
  var pnl = (window.__currentEventData || {}).pnl || {};
  window.__tierDraft = (pnl.ticket_tiers || []).map(function (t) {
    return { name: t.name, quantity: t.quantity, price: t.price };
  });
  if (!window.__tierDraft.length) window.__tierDraft.push({ name: 'סבב ראשון', quantity: '', price: '' });

  openBottomSheet('סבבי תמחור',
    '<div class="form-hint" style="margin-bottom:12px;">הסדר הוא סדר המכירה. נקודת האיזון מחושבת לפיו — קודם הסבב הראשון, ורק כשהוא נגמר עוברים לבא.</div>' +
    '<div id="tier-editor">' + tierEditorHtml_() + '</div>' +
    '<button type="button" class="btn btn-secondary btn-small" style="margin-top:12px;" onclick="addTierRow()">+ הוספת סבב</button>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-primary" onclick="saveTicketTiers()">שמור</button>' +
    '</div>');
}

function tierEditorHtml_() {
  return window.__tierDraft.map(function (t, i) {
    return '<div class="tier-edit">' +
      '<div class="tier-edit-top">' +
        '<input class="form-input" id="tier-name-' + i + '" value="' + escapeHtml(t.name || '') + '" ' +
          'placeholder="שם הסבב" aria-label="שם הסבב">' +
        '<button type="button" class="btn-ghost danger" onclick="removeTierRow(' + i + ')" ' +
          'aria-label="הסרת הסבב">הסר</button>' +
      '</div>' +
      '<div class="form-row">' +
        '<div><label class="form-label" for="tier-qty-' + i + '">כמות כרטיסים</label>' +
          '<input class="form-input" id="tier-qty-' + i + '" type="number" inputmode="numeric" min="0" ' +
            'value="' + (t.quantity === '' ? '' : t.quantity) + '"></div>' +
        '<div><label class="form-label" for="tier-price-' + i + '">מחיר לכרטיס</label>' +
          '<div class="money-input"><input class="form-input" id="tier-price-' + i + '" type="number" inputmode="decimal" min="0" ' +
            'value="' + (t.price === '' ? '' : t.price) + '"></div></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/** קורא את מה שהוקלד לפני שמצייררים מחדש, אחרת הקלדה נמחקת */
function readTierDraft_() {
  window.__tierDraft = window.__tierDraft.map(function (t, i) {
    var name = document.getElementById('tier-name-' + i);
    var qty = document.getElementById('tier-qty-' + i);
    var price = document.getElementById('tier-price-' + i);
    return {
      name: name ? name.value : t.name,
      quantity: qty ? qty.value : t.quantity,
      price: price ? price.value : t.price
    };
  });
}

function addTierRow() {
  readTierDraft_();
  window.__tierDraft.push({ name: '', quantity: '', price: '' });
  document.getElementById('tier-editor').innerHTML = tierEditorHtml_();
}

function removeTierRow(i) {
  readTierDraft_();
  window.__tierDraft.splice(i, 1);
  if (!window.__tierDraft.length) window.__tierDraft.push({ name: '', quantity: '', price: '' });
  document.getElementById('tier-editor').innerHTML = tierEditorHtml_();
}

function saveTicketTiers() {
  readTierDraft_();
  var tiers = window.__tierDraft
    .map(function (t, i) {
      return {
        name: String(t.name || '').trim() || ('סבב ' + (i + 1)),
        quantity: Number(t.quantity) || 0,
        price: Number(t.price) || 0
      };
    })
    .filter(function (t) { return t.quantity > 0; });

  callServer('setEventTicketTiers', window.__readinessEventId, tiers).then(function () {
    showToast('נשמר בהצלחה');
    closeBottomSheet();
    refreshCurrent();
  }).catch(function (err) { showToast(err, true); });
}

/* ============================================================
   לוח אמנים (סעיפים 14–15) — סדר לילה + אזהרת חפיפה
   ============================================================ */
function artistLineupBodyHtml(lineup) {
  if (!lineup.length) return '';
  return lineup.map(function (slot) {
    var warn = slot.overlaps_with && slot.overlaps_with.length
      ? '<div class="lineup-warn">' + ICON_ALERT + '<span>יש חפיפה עם ' + slot.overlaps_with.map(escapeHtml).join(', ') + '</span></div>'
      : '';
    var artist = (appState.cache.artists || []).filter(function (a) { return a.artist_id === slot.artist_id; })[0];
    var realName = artist && artist.real_name && artist.real_name !== slot.name ? '<div class="lineup-real">' + escapeHtml(artist.real_name) + '</div>' : '';
    return '<div class="lineup-row" role="button" tabindex="0" onclick="openExpenseSheet(\'' + appState.currentEventId + '\', \'' + slot.expense_id + '\')">' +
      '<span class="lineup-time">' + timeRangeText(slot.start_time, slot.end_time) + '</span>' +
      '<span class="lineup-main"><span class="lineup-name">' + escapeHtml(slot.name) + '</span>' + realName + '</span>' +
      '<span class="lineup-duration">' + escapeHtml(slot.duration_text) +
        (slot.hourly_rate ? '<span class="lineup-rate">' + formatCurrency(slot.hourly_rate) + ' לשעה</span>' : '') + '</span>' +
      warn +
    '</div>';
  }).join('');
}

/* ============================================================
   הערות ותזכורות (סעיפים 16–17)
   ============================================================ */
function noteRowHtml(note, entityType, entityId) {
  var isReminder = note.note_type === 'reminder';
  var meta = [];
  if (isReminder && note.reminder_date) meta.push('לתאריך ' + formatDate(note.reminder_date));
  meta.push('נוצר ' + formatDateTime(note.created_at));
  return '<div class="note-row' + (note.is_completed ? ' is-done' : '') + '">' +
    (isReminder
      ? '<button class="note-check" onclick="toggleNote(\'' + note.note_id + '\', ' + (note.is_completed ? 'false' : 'true') + ')" ' +
        'aria-label="' + (note.is_completed ? 'החזרה לפתוח' : 'סימון כהושלם') + '">' + (note.is_completed ? ICON_CHECK : '') + '</button>'
      : '<span class="note-dot" aria-hidden="true"></span>') +
    '<span class="note-main"><span class="note-content">' + escapeHtml(note.content) + '</span>' +
      '<span class="note-meta">' + meta.join(' · ') + (isReminder ? ' · ' + (note.is_completed ? 'הושלם' : 'פתוח') : '') + '</span></span>' +
    '<button class="icon-btn small" onclick="confirmArchiveNote(\'' + note.note_id + '\')" aria-label="מחיקת ההערה">' + ICON_TRASH + '</button>' +
  '</div>';
}

function notesBodyHtml(notes, entityType, entityId) {
  var body = notes.length
    ? notes.map(function (n) { return noteRowHtml(n, entityType, entityId); }).join('')
    : '<div class="form-hint" style="padding-block:6px 12px;">אין עדיין הערות או תזכורות.</div>';
  body += '<div class="btn-block-row" style="margin-top:10px;">' +
    '<button class="btn btn-secondary btn-small" onclick="openNoteSheet(\'' + entityType + '\', \'' + entityId + '\', \'note\')">+ הערה</button>' +
    '<button class="btn btn-secondary btn-small" onclick="openNoteSheet(\'' + entityType + '\', \'' + entityId + '\', \'reminder\')">+ תזכורת</button>' +
  '</div>';
  return body;
}

/**
 * @param {Object=} existing - {note_id, content, reminder_date} לעריכה של תזכורת קיימת.
 *   saveEntityNote כבר מקבל note_id, ולכן העריכה היא ממשק בלבד.
 */
function openNoteSheet(entityType, entityId, noteType, existing) {
  var isReminder = noteType === 'reminder';
  var noteId = existing && existing.note_id ? existing.note_id : '';
  var body = '<form onsubmit="submitNoteForm(event, \'' + entityType + '\', \'' + entityId + '\', \'' + noteType + '\', \'' + noteId + '\')">' +
    '<div class="form-group"><label class="form-label" for="note-content">' + (isReminder ? 'מה לזכור?' : 'תוכן ההערה') + '<span class="required">*</span></label>' +
      '<textarea class="form-textarea" id="note-content" name="content" required autofocus>' +
        escapeHtml(existing ? existing.content : '') + '</textarea></div>' +
    (isReminder
      ? '<div class="form-group"><label class="form-label" for="note-date">תאריך התזכורת</label>' +
        '<input class="form-input" id="note-date" type="date" value="' +
          toDateInputValue(existing ? existing.reminder_date : '') + '"></div>'
      : '') +
    '<div class="sheet-actions"><button class="btn btn-gold" type="submit" id="note-save-btn">שמור</button></div></form>';
  openBottomSheet(noteId ? 'עריכת תזכורת' : (isReminder ? 'תזכורת חדשה' : 'הערה חדשה'), body);
}

function submitNoteForm(e, entityType, entityId, noteType, noteId) {
  e.preventDefault();
  var btn = document.getElementById('note-save-btn');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'שומר...';
  var dateEl = document.getElementById('note-date');
  var payload = {
    note_type: noteType,
    content: document.getElementById('note-content').value,
    reminder_date: dateEl ? dateEl.value : ''
  };
  // עדכון מזוהה לפי note_id בלבד; יצירה דורשת את הישות
  if (noteId) payload.note_id = noteId;
  else { payload.entity_type = entityType; payload.entity_id = entityId; }
  callServer('saveEntityNote', payload).then(function () {
    showToast('נשמר בהצלחה');
    closeBottomSheet();
    if (entityType === 'artist') reloadArtistNotes(entityId); else refreshCurrent();
  }).catch(function (err) {
    showToast(err, true);
    btn.disabled = false; btn.textContent = 'שמור';
  });
}

function toggleNote(noteId, completed) {
  callServer('toggleNoteCompleted', noteId, completed).then(function () {
    var artistId = expenseSheetState && expenseSheetState.__artistNotesId;
    if (artistId) reloadArtistNotes(artistId); else refreshCurrent();
  }).catch(function (err) { showToast(err, true); });
}

function confirmArchiveNote(noteId) {
  openConfirmDialog('למחוק את ההערה?', 'ההערה תוסתר, והרשומה תישמר לצורכי היסטוריה.', function () {
    callServer('archiveEntityNote', noteId).then(function () {
      showToast('ההערה נמחקה');
      closeBottomSheet();
      var artistId = expenseSheetState && expenseSheetState.__artistNotesId;
      if (artistId) reloadArtistNotes(artistId); else refreshCurrent();
    }).catch(function (err) { showToast(err, true); });
  });
}

function breakdownRowsHtml(kind) {
  var b = window.__breakdown;
  var map = kind === 'vendor' ? b.byVendor : b.byCategory;
  var keys = Object.keys(map).sort(function (x, y) { return map[y] - map[x]; });
  if (!keys.length) {
    return '<div class="form-hint" style="padding-block:10px;">אין עדיין הוצאות ששויכו לספק. הוצאות אמנים מופיעות לפי קטגוריה.</div>';
  }
  return keys.map(function (k, i) {
    var pct = Math.max(2, Math.round(map[k] / b.total * 100));
    var subs = kind === 'category' ? (b.bySubcategory[k] || null) : null;
    var subKeys = subs ? Object.keys(subs).sort(function (x, y) { return subs[y] - subs[x]; }) : [];
    // Accordion רק כשיש פירוט אמיתי (לא רק "ללא תת-קטגוריה"). "אמנים" מגיעה בלי פירוט מהשרת.
    var expandable = subKeys.length > 1 || (subKeys.length === 1 && subKeys[0] !== 'ללא תת-קטגוריה');
    var head = '<div class="breakdown-top"><span class="bd-name">' + escapeHtml(k) + (expandable ? '<span class="bd-chevron" id="bd-caret-' + i + '">' + ICON_CHEVRON + '</span>' : '') + '</span><b>' + money(map[k]) + '</b></div>' +
      '<div class="breakdown-bar"><i style="width:' + pct + '%"></i></div>';
    if (!expandable) return '<div class="breakdown-row">' + head + '</div>';
    return '<div class="breakdown-row">' +
      '<div role="button" tabindex="0" aria-expanded="false" id="bd-toggle-' + i + '" onclick="toggleBreakdownGroup(' + i + ')" style="cursor:pointer;">' + head + '</div>' +
      '<div class="bd-subs" id="bd-subs-' + i + '" hidden><div class="cat-subs-label">פירוט לפי תת-קטגוריה</div>' + subKeys.map(function (sk) {
        var spct = Math.max(2, Math.round(subs[sk] / map[k] * 100));
        return '<div class="bd-sub"><div class="breakdown-top"><span>' + escapeHtml(sk) + '</span><b>' + money(subs[sk]) + '</b></div>' +
          '<div class="breakdown-bar"><i style="width:' + spct + '%"></i></div></div>';
      }).join('') + '</div>' +
    '</div>';
  }).join('');
}

function toggleBreakdownGroup(i) {
  var el = document.getElementById('bd-subs-' + i);
  var open = el.hasAttribute('hidden');
  if (open) el.removeAttribute('hidden'); else el.setAttribute('hidden', '');
  document.getElementById('bd-caret-' + i).classList.toggle('open', open);
  document.getElementById('bd-toggle-' + i).setAttribute('aria-expanded', String(open));
}

function switchBreakdown(btn) {
  document.querySelectorAll('#breakdown-toggle button').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('breakdown-body').innerHTML = breakdownRowsHtml(btn.getAttribute('data-kind'));
}

function expenseItemHtml(ex) {
  var who = ex.artist_name || ex.vendor_name || '';
  var catPath = escapeHtml(ex.category_name || '') + (ex.subcategory_name ? ' <span class="path-sep" aria-label="תת-קטגוריה">←</span> ' + escapeHtml(ex.subcategory_name) : '');
  var sub = [catPath, who ? escapeHtml(who) : ''].filter(Boolean).join(' · ');
  var chips = statusChipHtml(ex.computed_status) + (ex.has_overdue ? ' ' + statusChipHtml(STATUS.OVERDUE) : '');

  var line;
  if (ex.agreed_amount > 0 && ex.remaining_amount <= 0) line = 'שולם במלואו';
  else if (ex.paid_amount > 0) line = 'שולם ' + formatCurrency(ex.paid_amount) + ' · נותר ' + formatCurrency(ex.remaining_amount);
  else line = 'נותר ' + formatCurrency(ex.remaining_amount);
  if (ex.next_due_date && !ex.has_overdue) line += ' · מועד ' + formatDate(ex.next_due_date);

  return '' +
    '<div class="expense-item" role="button" tabindex="0" onclick="openExpenseSheet(\'' + ex.event_id + '\', \'' + ex.expense_id + '\')">' +
      '<div class="expense-main">' +
        '<div class="expense-name">' + escapeHtml(ex.name) + '</div>' +
        '<div class="expense-sub"><span>' + sub + '</span>' + chips + '</div>' +
        '<div class="expense-remaining">' + line + '</div>' +
      '</div>' +
      '<div class="expense-amounts">' +
        '<div class="expense-total">' + money(ex.agreed_amount) + '</div>' +
      '</div>' +
    '</div>';
}

function incomeItemHtml(inc) {
  return '' +
    '<div class="expense-item" role="button" tabindex="0" onclick="openIncomeSheet(\'' + inc.event_id + '\', \'' + inc.income_id + '\')">' +
      '<div class="expense-main">' +
        '<div class="expense-name">' + escapeHtml(inc.name) + '</div>' +
        '<div class="expense-sub"><span class="num">' + formatNumber(inc.quantity) + ' × ' + formatNumber(inc.unit_price) + ' ₪</span></div>' +
      '</div>' +
      '<div class="expense-amounts"><div class="expense-total">' + money(inc.total_amount) + '</div></div>' +
    '</div>';
}

function openEventActionsMenu(eventId) {
  openActionSheet('פעולות אירוע', [
    { label: 'ערוך אירוע', action: function () { openEventEditSheet(eventId); } },
    { label: 'ארכב אירוע', action: function () { confirmArchiveEvent(eventId); }, danger: true }
  ]);
}

function confirmArchiveEvent(eventId) {
  openConfirmDialog('לארכב את האירוע?', 'האירוע יוסתר מהרשימה אך ההיסטוריה תישמר.', function () {
    callServer('archiveEvent', eventId).then(function () {
      showToast('נשמר בהצלחה');
      closeBottomSheet();
      navigate('events', { root: true });
    }).catch(function (err) { showToast(err, true); });
  });
}

function openEventEditSheet(eventId) {
  var cached = window.__currentEventData && window.__currentEventData.event.event_id === eventId ? window.__currentEventData : null;
  (cached ? Promise.resolve(cached) : callServer('getEventDetails', eventId)).then(function (data) {
    var ev = data.event;
    var body = '' +
      '<form id="event-edit-form" onsubmit="submitEventEditForm(event, \'' + eventId + '\')">' +
        '<div class="form-group"><label class="form-label" for="ee-name">שם האירוע<span class="required">*</span></label>' +
          '<input class="form-input" id="ee-name" name="name" required value="' + escapeHtml(ev.name) + '"></div>' +
        '<div class="form-group"><label class="form-label" for="ee-date">תאריך<span class="required">*</span></label>' +
          '<input class="form-input" id="ee-date" type="date" name="event_date" required value="' + toDateInputValue(ev.event_date) + '"></div>' +
        '<div class="form-group"><label class="form-label" for="ee-location">מיקום</label>' +
          '<input class="form-input" id="ee-location" name="location" value="' + escapeHtml(ev.location) + '"></div>' +
        '<div class="form-group"><label class="form-label" for="ee-notes">הערות כלליות</label>' +
          '<textarea class="form-textarea" id="ee-notes" name="general_notes">' + escapeHtml(ev.general_notes) + '</textarea></div>' +
        '<div class="perf-box">' +
          '<div class="perf-title">תחזית כרטיסים <span class="optional">(לא חובה)</span></div>' +
          '<div class="form-row">' +
            '<div class="form-group"><label class="form-label" for="ee-price">מחיר כרטיס ממוצע</label>' +
              '<div class="money-input"><input class="form-input" id="ee-price" name="average_ticket_price" type="number" inputmode="numeric" min="0" step="1" value="' + (ev.average_ticket_price || '') + '" placeholder="0"></div></div>' +
            '<div class="form-group"><label class="form-label" for="ee-tickets">כמות כרטיסים צפויה</label>' +
              '<input class="form-input" id="ee-tickets" name="expected_ticket_count" type="number" inputmode="numeric" min="0" step="1" value="' + (ev.expected_ticket_count || '') + '" placeholder="0"></div>' +
          '</div>' +
        '</div>' +
        '<button class="btn btn-gold" type="submit" id="event-edit-save-btn">שמור שינויים</button>' +
      '</form>';
    openBottomSheet('עריכת אירוע', body);
  }).catch(function (err) { showToast(err, true); });
}

function submitEventEditForm(e, eventId) {
  e.preventDefault();
  var btn = document.getElementById('event-edit-save-btn');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'שומר...';
  var form = e.target;
  callServer('updateEvent', {
    event_id: eventId,
    name: form.name.value,
    event_date: form.event_date.value,
    location: form.location.value,
    general_notes: form.general_notes.value,
    average_ticket_price: form.average_ticket_price.value,
    expected_ticket_count: form.expected_ticket_count.value
  }).then(function () {
    showToast('נשמר בהצלחה');
    closeBottomSheet();
    refreshCurrent();
  }).catch(function (err) {
    showToast(err, true);
    btn.disabled = false; btn.textContent = 'שמור שינויים';
  });
}

/* ============================================================
   EXPENSE — Bottom Sheet (Create / Edit + Payments)
   ============================================================ */
/**
 * כותרת טופס ההוצאה. הכפתור והחלון חייבים להגיד את אותו דבר —
 * "הוסף אמן לאירוע" שנפתח כ"הוספת הוצאה" הוא בדיוק מה שבלבל.
 */
function expenseSheetTitle_(existing, intent) {
  if (existing) return 'עריכת הוצאה';
  return intent === 'artist' ? 'הוספת אמן לאירוע' : 'הוספת הוצאה';
}

var expenseSheetState = {};

/**
 * טופס ההוצאה.
 * @param {string} eventId
 * @param {string=} expenseId - עריכה של הוצאה קיימת
 * @param {string=} intent - 'artist' כשנכנסים דרך "הוספת אמן לאירוע":
 *   משנה את הכותרת ומסמן מראש את קטגוריית האמנים. אותו טופס, אותה שמירה.
 */
function openExpenseSheet(eventId, expenseId, intent) {
  expenseSheetState = {
    eventId: eventId, expenseId: expenseId || null, intent: intent || null,
    categoryId: null, vendorId: null, artistId: null, whomIsArtist: false,
    payments: [], originalAgreed: null, originalManual: null,
    statusChoice: STATUS.PLANNED, editingPayment: null, paymentsChanged: false
  };
  openBottomSheet(expenseSheetTitle_(expenseId, intent),
    '<div class="loading-wrap" style="padding-block:40px;"><div class="spinner"></div></div>');

  var loadExisting = Promise.resolve(null);
  if (expenseId) {
    var cached = appState.screen === 'eventDetails' && appState.currentEventId === eventId
      ? (window.__currentEventExpenses || []).filter(function (x) { return x.expense_id === expenseId; })[0]
      : null;
    loadExisting = cached ? Promise.resolve(cached) : callServer('getExpensesForEvent', eventId).then(function (list) {
      return list.filter(function (x) { return x.expense_id === expenseId; })[0] || null;
    });
  }

  Promise.all([ensureLookups(), loadExisting]).then(function (res) {
    var existing = res[1];
    if (expenseId && !existing) { closeBottomSheet(); showToast('ההוצאה לא נמצאה.', true); return; }
    renderExpenseSheetBody(existing);
  }).catch(function (err) { closeBottomSheet(); showToast(err, true); });
}

/** מצב פשוט: אין תשלומים, או תשלום אחד בגובה ההוצאה — הטופס הראשי מנהל אותו */
function isSimplePaymentMode() {
  var p = expenseSheetState.payments;
  return p.length === 0 || (p.length === 1 && Number(p[0].amount) === Number(expenseSheetState.originalAgreed));
}
function singlePayment() {
  return isSimplePaymentMode() ? (expenseSheetState.payments[0] || null) : null;
}

function renderExpenseSheetBody(existing) {
  var s = expenseSheetState;
  // נכנסו דרך "הוספת אמן לאירוע" — הקטגוריה כבר ידועה, אין סיבה לבחור אותה ידנית
  var artistsCat = (!existing && s.intent === 'artist') ? artistsCategoryId_() : null;
  s.categoryId = existing ? existing.category_id : artistsCat;
  s.subcategoryId = existing ? (existing.subcategory_id || null) : null;
  s.vendorId = existing ? existing.vendor_id : null;
  s.artistId = existing ? existing.artist_id : null;
  s.payments = existing ? (existing.payments || []).slice() : [];
  s.coverage = existing ? (existing.covered_items || []).map(function (c) {
    return { key: c.key, category_id: c.category_id, subcategory_id: c.subcategory_id, custom_label: c.custom_label, name: c.name };
  }) : [];
  s.coverageOn = s.coverage.length > 0;
  s.coverageShowAll = false;
  s.originalAgreed = existing ? existing.agreed_amount : null;
  s.originalManual = existing ? existing.manual_status : null;
  var single = singlePayment();
  s.statusChoice = single && single.is_paid ? STATUS.PAID : ((existing && existing.manual_status) || STATUS.PLANNED);

  // ארבעה אזורי עבודה: מה מתחייבים, מה סוכם כספית, מה כלול, ופרטים משלימים.
  // אף שדה לא הוסר — רק קובץ תחת הכותרת שמסבירה מה מחליטים בו.
  var body = '' +
    '<form id="expense-form" onsubmit="submitExpenseForm(event)">' +

      '<fieldset class="form-block">' +
        '<legend class="form-block-title">מה מתחייבים</legend>' +
        '<div class="form-group">' +
          '<label class="form-label" for="expense-name">על מה ההוצאה?<span class="required">*</span></label>' +
          '<input class="form-input" id="expense-name" name="name" required maxlength="150" value="' + escapeHtml(existing ? existing.name : '') + '" placeholder="לדוגמה: ציליה, DJ, גנרטור">' +
        '</div>' +
        '<div class="form-group">' +
          '<label class="form-label" for="category-search">קטגוריה<span class="required">*</span></label>' +
          '<div class="autocomplete-wrap">' +
            '<input class="form-input" id="category-search" placeholder="בחר או הקלד קטגוריה" autocomplete="off" ' +
              'value="' + escapeHtml(categoryNameById(s.categoryId)) + '" oninput="expenseSheetState.categoryId = null; refreshCoverageField(); onCategorySearch(this.value)" onfocus="onCategorySearch(this.value)">' +
            '<div id="category-list" class="autocomplete-list" style="display:none;"></div>' +
          '</div>' +
        '</div>' +
        '<div id="subcategory-field">' + renderSubcategoryFieldHtml() + '</div>' +
        '<div class="form-group" id="whom-field">' + renderWhomFieldHtml() + '</div>' +
        '<div id="performance-field">' + renderPerformanceFieldHtml(existing) + '</div>' +
      '</fieldset>' +

      '<fieldset class="form-block">' +
        '<legend class="form-block-title">מצב כספי</legend>' +
        '<div class="form-group" id="status-field">' + renderStatusFieldHtml() + '</div>' +
        '<div id="amount-field">' + renderAmountFieldHtml(existing) + '</div>' +
        (existing ? '<div id="expense-money-summary">' + paymentSummaryHtml().replace('id="payment-summary"', 'id="payment-summary-top"') + '</div>' : '') +
        '<div id="quick-pay">' + renderQuickPayHtml({}) + '</div>' +
        '<div id="payments-section">' + renderPaymentsSectionHtml() + '</div>' +
      '</fieldset>' +

      '<fieldset class="form-block">' +
        '<legend class="form-block-title">מה כלול במחיר</legend>' +
        '<div id="coverage-field">' + renderCoverageFieldHtml() + '</div>' +
      '</fieldset>' +

      '<div class="accordion-toggle" role="button" tabindex="0" aria-expanded="false" ' +
          'aria-controls="expense-extra-details" onclick="toggleExpenseDetails()">' +
        '<span>פרטים נוספים</span><span id="details-caret" aria-hidden="true">▾</span>' +
      '</div>' +
      '<div id="expense-extra-details" hidden>' +
        '<div class="form-row">' +
          '<div class="form-group"><label class="form-label" for="expense-date">תאריך</label>' +
            '<input class="form-input" id="expense-date" name="expense_date" type="date" value="' + toDateInputValue(existing ? existing.expense_date : '') + '"></div>' +
          '<div class="form-group"><label class="form-label" for="expense-paid-by">מי שילם</label>' +
            '<input class="form-input" id="expense-paid-by" name="paid_by" value="' + escapeHtml(existing ? existing.paid_by : '') + '"></div>' +
        '</div>' +
        '<div class="form-group"><label class="form-label" for="expense-notes">הערות פנימיות</label>' +
          '<textarea class="form-textarea" id="expense-notes" name="internal_notes">' + escapeHtml(existing ? existing.internal_notes : '') + '</textarea></div>' +
      '</div>' +

      '<div class="sheet-actions">' +
        '<button class="btn btn-gold" type="submit" id="expense-save-btn">שמור הוצאה</button>' +
      '</div>' +
      (existing ? '<button type="button" class="btn btn-danger-ghost" style="margin-top:10px;" onclick="confirmArchiveExpense(\'' + existing.expense_id + '\')">מחק הוצאה</button>' : '') +
    '</form>';

  openBottomSheet(expenseSheetTitle_(existing, expenseSheetState.intent), body, function () {
    if (expenseSheetState.paymentsChanged) refreshCurrent();
  });
  updatePlannedDiff();
  updatePerformanceInfo();
}

/* ---- "מה כלול במחיר" — רק בהשכרת שטח ---- */

function renderCoverageFieldHtml() {
  var s = expenseSheetState;
  if (!s.categoryId) return ''; // אין עדיין על מה לשאול

  var html = '<div class="form-group nested-field">' +
    '<label class="form-label">האם המחיר כולל שירותים או ציוד נוספים?</label>' +
    '<div class="segmented" id="coverage-toggle">' +
      '<button type="button" class="' + (s.coverageOn ? '' : 'active') + '" onclick="setCoverageOn(false)">לא</button>' +
      '<button type="button" class="' + (s.coverageOn ? 'active' : '') + '" onclick="setCoverageOn(true)">כן</button>' +
    '</div>';

  if (s.coverageOn) html += '<div id="coverage-picker">' + renderCoveragePickerHtml() + '</div>';
  return html + '</div>';
}

function renderCoveragePickerHtml() {
  var s = expenseSheetState;
  var options = (appState.cache.coverageOptions || []).slice();
  var chosen = {};
  s.coverage.forEach(function (c) { chosen[c.key] = true; });

  // כל רכיב שכבר מסומן מוצג תמיד — גם רכיב חופשי, וגם אם רשימת הבחירה עוד לא נטענה
  s.coverage.forEach(function (c) {
    if (!options.some(function (o) { return o.key === c.key; })) {
      options.unshift({
        key: c.key, category_id: c.category_id || '', subcategory_id: c.subcategory_id || '',
        custom_label: c.custom_label || '', name: c.name, is_common: true
      });
    }
  });

  // הוצאה לא יכולה "לכלול" את עצמה — מחריגים את הקטגוריה/תת-הקטגוריה שלה
  var ownKey = s.subcategoryId ? ('sub:' + s.subcategoryId) : (s.categoryId ? ('cat:' + s.categoryId) : '');
  options = options.filter(function (o) { return o.key !== ownKey; });

  var visible = s.coverageShowAll ? options : options.filter(function (o) { return o.is_common || chosen[o.key]; });
  var alreadyElsewhere = coveredElsewhereMap();

  var chips = visible.map(function (o) {
    var isOn = !!chosen[o.key];
    var warn = (!isOn && alreadyElsewhere[o.key]) ? ' title="כבר מסומן ככלול ב' + escapeHtml(alreadyElsewhere[o.key]) + '"' : '';
    return '<button type="button" class="coverage-chip' + (isOn ? ' is-on' : '') +
      (alreadyElsewhere[o.key] ? ' is-dup' : '') + '"' + warn +
      ' onclick="toggleCoverageChip(\'' + o.key + '\')">' +
      (isOn ? '<span class="chip-check">✓</span>' : '') + escapeHtml(o.name) + '</button>';
  }).join('');

  var dupNames = s.coverage.filter(function (c) { return alreadyElsewhere[c.key]; })
    .map(function (c) { return c.name + ' (כבר כלול ב' + alreadyElsewhere[c.key] + ')'; });

  return '<div class="coverage-chips">' + chips +
      (s.coverageShowAll
        ? '<button type="button" class="coverage-chip is-link" onclick="toggleCoverageShowAll()">הצג פחות</button>'
        : '<button type="button" class="coverage-chip is-link" onclick="toggleCoverageShowAll()">הצג הכל</button>') +
      '<button type="button" class="coverage-chip is-link" onclick="addCustomCoverage()">+ רכיב אחר</button>' +
    '</div>' +
    (s.coverage.length === 0
      ? '<div class="form-hint">אפשר לשמור גם בלי לסמן רכיבים — הסימון נועד רק כדי לדעת מה כבר סגור.</div>' : '') +
    (dupNames.length ? '<div class="form-hint warn">' + escapeHtml(dupNames.join(' · ')) + '. אפשר להמשיך בכל מקרה.</div>' : '');
}

/** רכיבים שכבר מכוסים על ידי הוצאה אחרת באירוע — לאזהרה רכה בלבד */
function coveredElsewhereMap() {
  var out = {};
  var data = window.__currentEventData;
  if (!data || !data.expenses) return out;
  data.expenses.forEach(function (ex) {
    if (ex.expense_id === expenseSheetState.expenseId) return;
    (ex.covered_items || []).forEach(function (c) { if (!out[c.key]) out[c.key] = ex.name; });
  });
  return out;
}

function setCoverageOn(on) {
  expenseSheetState.coverageOn = on;
  if (!on) expenseSheetState.coverage = [];
  refreshCoverageField();
}

function toggleCoverageShowAll() {
  expenseSheetState.coverageShowAll = !expenseSheetState.coverageShowAll;
  refreshCoveragePicker();
}

function toggleCoverageChip(key) {
  var s = expenseSheetState;
  var idx = -1;
  s.coverage.forEach(function (c, i) { if (c.key === key) idx = i; });
  if (idx >= 0) { s.coverage.splice(idx, 1); refreshCoveragePicker(); return; }

  var opt = (appState.cache.coverageOptions || []).filter(function (o) { return o.key === key; })[0];
  if (!opt) return; // רק הוספה דורשת את הרשימה; הסרה כבר טופלה למעלה
  s.coverage.push({ key: opt.key, category_id: opt.category_id, subcategory_id: opt.subcategory_id, custom_label: opt.custom_label, name: opt.name });
  refreshCoveragePicker();
}

function addCustomCoverage() {
  var label = (window.prompt('מה עוד כלול במחיר?') || '').trim();
  if (!label) return;
  var key = 'label:' + label;
  if (expenseSheetState.coverage.some(function (c) { return c.key === key; })) return;
  expenseSheetState.coverage.push({ key: key, category_id: '', subcategory_id: '', custom_label: label, name: label });
  expenseSheetState.coverageShowAll = true;
  refreshCoveragePicker();
}

function refreshCoverageField() {
  var el = document.getElementById('coverage-field');
  if (el) el.innerHTML = renderCoverageFieldHtml();
}
function refreshCoveragePicker() {
  var el = document.getElementById('coverage-picker');
  if (el) el.innerHTML = renderCoveragePickerHtml();
  else refreshCoverageField();
}

/** מזהה קטגוריית "אמנים", אם קיימת */
function artistsCategoryId_() {
  var hit = (appState.cache.categories || []).filter(function (c) { return isCategoryArtists(c.category_id); })[0];
  return hit ? hit.category_id : null;
}

function isCategoryArtists(categoryId) {
  var cat = appState.cache.categories.filter(function (c) { return c.category_id === categoryId; })[0];
  return !!(cat && cat.name === 'אמנים');
}
function categoryNameById(id) {
  var cat = appState.cache.categories.filter(function (c) { return c.category_id === id; })[0];

}
function vendorNameById(id) {
  var v = appState.cache.vendors.filter(function (x) { return x.vendor_id === id; })[0];

}
function artistNameById(id) {
